<circle cx="738" cy="170" r="6" fill="none" stroke="#2a8a3a" stroke-width="2" stroke-dasharray="3 2"/><text x="610" y="245" font-size="11" fill="#2a8a3a">зелёный пунктир: где должна быть метка</text>
<g stroke="#d33" stroke-width="4"><line x1="604" y1="100" x2="624" y2="120"/><line x1="624" y1="100" x2="604" y2="120"/></g>
<text x="610" y="290" font-size="12" fill="#222">Метки не напротив друг друга:</text>
<text x="610" y="307" font-size="12" fill="#222">шестерню поставили со сдвигом</text>
<text x="610" y="324" font-size="12" fill="#222">на один зуб. Клапаны будут</text>
<text x="610" y="341" font-size="12" fill="#222">открываться не вовремя: мотор</text>
<text x="610" y="358" font-size="12" fill="#222">плохо работает или клапаны</text>
<text x="610" y="375" font-size="12" fill="#222">бьют по поршням.</text>
<text x="610" y="420" font-size="12" fill="#222" font-weight="bold">Порядок работы:</text>
<text x="610" y="437" font-size="12" fill="#222">1. Коленвал повернуть в положение</text>
<text x="610" y="454" font-size="12" fill="#222">   из ТК (обычно ВМТ 1-го цилиндра).</text>
<text x="610" y="471" font-size="12" fill="#222">2. Ставить шестерни так, чтобы</text>
<text x="610" y="488" font-size="12" fill="#222">   метки встали напротив.</text>
<text x="610" y="505" font-size="12" fill="#222">3. Затянуть крепёж по ТК.</text>
<text x="610" y="522" font-size="12" fill="#222">4. Проверить метки ещё раз,</text>
<text x="610" y="539" font-size="12" fill="#222">   провернуть вал на 2 оборота</text>
<text x="610" y="556" font-size="12" fill="#222">   и проверить снова.</text>
<text x="30" y="585" font-size="11" fill="#777">Метки бывают точками, рисками, цифрами, буквами. Число и расположение шестерён у вашего мотора может быть другим (ещё бывает шестерня ТНВД).</text>
</svg>