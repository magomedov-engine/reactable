<text x="354.28536204792914" y="202.9523835386383" font-size="11" fill="#555">(зубьев в 2 раза больше: крутится</text><text x="354.28536204792914" y="216.9523835386383" font-size="11" fill="#555">в 2 раза медленнее коленвала)</text>
