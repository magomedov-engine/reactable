<text x="30" y="80" stroke="none">Носок: шестерня привода ГРМ, шкив</text><line x1="60" y1="84" x2="62" y2="192"/>
<text x="250" y="70" stroke="none" fill="#b26a00" font-weight="bold">Шатунная шейка: на ней ДВА шатуна (левый и правый ряд)</text><line x1="300" y1="74" x2="149" y2="150"/>
<text x="500" y="100" stroke="none">Щека</text><line x1="520" y1="104" x2="504" y2="195"/>
<text x="30" y="345" stroke="none">Коренная шейка: лежит во вкладышах блока (номера 1–7)</text><line x1="80" y1="333" x2="105" y2="245"/>
<text x="330" y="310" stroke="none">Противовес</text><line x1="370" y1="298" x2="294" y2="270"/>
<text x="430" y="370" stroke="none" fill="#2f6db5">Упорные полукольца: держат вал от сдвига вдоль оси</text><line x1="500" y1="358" x2="372" y2="250" stroke="#2f6db5"/>
<text x="30" y="370" stroke="none" fill="#7a6500">Пунктир внутри: масляный канал от коренной шейки к шатунной</text><line x1="130" y1="358" x2="135" y2="226" stroke="#a08300"/>
<text x="600" y="130" stroke="none">Фланец маховика</text><line x1="650" y1="134" x2="637" y2="162"/>
</g>
<text x="30" y="405" font-size="12" fill="#555">Сборщику важно: шейки не царапать и не трогать железом; масляные каналы чистые (продуты);</text>
<text x="30" y="421" font-size="12" fill="#555">вал укладывают краном на мягких стропах ровно, не ударяя шейками; после каждой крышки проверяют,</text>
<text x="30" y="437" font-size="12" fill="#555">что вал крутится от руки; осевой люфт меряют индикатором.</text>
<text x="30" y="472" font-size="11" fill="#999">У V12 обычно 7 коренных и 6 шатунных шеек. Положение шатунных шеек по кругу на рисунке условное.</text>
