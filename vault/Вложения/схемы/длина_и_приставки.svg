<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="Arial, sans-serif">
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
<rect width="860" height="640" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Длина: от миллиметра до микрона</text>
<rect x="30" y="50" width="190" height="200" rx="10" fill="#fafbfc" stroke="#2f6db5" stroke-width="2"/>
<text x="125" y="82" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f6db5">1 мм</text>
<text x="125" y="102" text-anchor="middle" font-size="13" fill="#222">миллиметр</text>
<rect x="45" y="130" width="160" height="30" fill="#e3e7eb" stroke="#333"/>
<line x1="45" y1="130" x2="45" y2="144" stroke="#333"/>
<line x1="61" y1="130" x2="61" y2="138" stroke="#333"/>
<line x1="77" y1="130" x2="77" y2="138" stroke="#333"/>
<line x1="93" y1="130" x2="93" y2="138" stroke="#333"/>
<line x1="109" y1="130" x2="109" y2="138" stroke="#333"/>
<line x1="125" y1="130" x2="125" y2="144" stroke="#333"/>
<line x1="141" y1="130" x2="141" y2="138" stroke="#333"/>
<line x1="157" y1="130" x2="157" y2="138" stroke="#333"/>
<line x1="173" y1="130" x2="173" y2="138" stroke="#333"/>
<line x1="189" y1="130" x2="189" y2="138" stroke="#333"/>
<line x1="205" y1="130" x2="205" y2="144" stroke="#333"/>
<rect x="45" y="130" width="16" height="30" fill="#2f6db5" opacity="0.35"/>
<text x="125" y="180" text-anchor="middle" font-size="11" fill="#555">1/10 часть = 0,1 мм</text>
<line x1="220" y1="145" x2="242" y2="145" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<text x="125" y="210" font-size="11" fill="#333" text-anchor="middle">толщина банковской карты ~0,8 мм</text>
<text x="125" y="226" font-size="11" fill="#333" text-anchor="middle"></text>
<rect x="235" y="50" width="190" height="200" rx="10" fill="#fafbfc" stroke="#2a8a3a" stroke-width="2"/>
<text x="330" y="82" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a8a3a">0,1 мм</text>
<text x="330" y="102" text-anchor="middle" font-size="13" fill="#222">«десятка»</text>
<rect x="250" y="130" width="160" height="30" fill="#e3e7eb" stroke="#333"/>
<line x1="250" y1="130" x2="250" y2="144" stroke="#333"/>
<line x1="266" y1="130" x2="266" y2="138" stroke="#333"/>
<line x1="282" y1="130" x2="282" y2="138" stroke="#333"/>
<line x1="298" y1="130" x2="298" y2="138" stroke="#333"/>
<line x1="314" y1="130" x2="314" y2="138" stroke="#333"/>
<line x1="330" y1="130" x2="330" y2="144" stroke="#333"/>
<line x1="346" y1="130" x2="346" y2="138" stroke="#333"/>
<line x1="362" y1="130" x2="362" y2="138" stroke="#333"/>
<line x1="378" y1="130" x2="378" y2="138" stroke="#333"/>
<line x1="394" y1="130" x2="394" y2="138" stroke="#333"/>
<line x1="410" y1="130" x2="410" y2="144" stroke="#333"/>
<rect x="250" y="130" width="16" height="30" fill="#2a8a3a" opacity="0.35"/>
<text x="330" y="180" text-anchor="middle" font-size="11" fill="#555">1/10 часть = 0,01 мм</text>
<line x1="425" y1="145" x2="447" y2="145" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<text x="330" y="210" font-size="11" fill="#333" text-anchor="middle">лист бумаги ~0,1 мм</text>
<text x="330" y="226" font-size="11" fill="#333" text-anchor="middle"></text>
<rect x="440" y="50" width="190" height="200" rx="10" fill="#fafbfc" stroke="#e59a14" stroke-width="2"/>
<text x="535" y="82" text-anchor="middle" font-size="22" font-weight="bold" fill="#e59a14">0,01 мм</text>
<text x="535" y="102" text-anchor="middle" font-size="13" fill="#222">«сотка»</text>
<rect x="455" y="130" width="160" height="30" fill="#e3e7eb" stroke="#333"/>
<line x1="455" y1="130" x2="455" y2="144" stroke="#333"/>
<line x1="471" y1="130" x2="471" y2="138" stroke="#333"/>
<line x1="487" y1="130" x2="487" y2="138" stroke="#333"/>
<line x1="503" y1="130" x2="503" y2="138" stroke="#333"/>
<line x1="519" y1="130" x2="519" y2="138" stroke="#333"/>
<line x1="535" y1="130" x2="535" y2="144" stroke="#333"/>
<line x1="551" y1="130" x2="551" y2="138" stroke="#333"/>
<line x1="567" y1="130" x2="567" y2="138" stroke="#333"/>
<line x1="583" y1="130" x2="583" y2="138" stroke="#333"/>
<line x1="599" y1="130" x2="599" y2="138" stroke="#333"/>
<line x1="615" y1="130" x2="615" y2="144" stroke="#333"/>
<rect x="455" y="130" width="16" height="30" fill="#e59a14" opacity="0.35"/>
<text x="535" y="180" text-anchor="middle" font-size="11" fill="#555">1/10 часть = 0,001 мм</text>
<line x1="630" y1="145" x2="652" y2="145" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<text x="535" y="210" font-size="11" fill="#333" text-anchor="middle">цена деления микрометра;</text>
<text x="535" y="226" font-size="11" fill="#333" text-anchor="middle">волос ~0,05–0,08 мм = 5–8 соток</text>
<rect x="645" y="50" width="190" height="200" rx="10" fill="#fafbfc" stroke="#d33" stroke-width="2"/>
<text x="740" y="82" text-anchor="middle" font-size="22" font-weight="bold" fill="#d33">0,001 мм</text>
<text x="740" y="102" text-anchor="middle" font-size="13" fill="#222">1 мкм (микрон)</text>
<rect x="660" y="130" width="160" height="30" fill="#e3e7eb" stroke="#333"/>
<line x1="660" y1="130" x2="660" y2="144" stroke="#333"/>
<line x1="676" y1="130" x2="676" y2="138" stroke="#333"/>
<line x1="692" y1="130" x2="692" y2="138" stroke="#333"/>
<line x1="708" y1="130" x2="708" y2="138" stroke="#333"/>
<line x1="724" y1="130" x2="724" y2="138" stroke="#333"/>
<line x1="740" y1="130" x2="740" y2="144" stroke="#333"/>
<line x1="756" y1="130" x2="756" y2="138" stroke="#333"/>
<line x1="772" y1="130" x2="772" y2="138" stroke="#333"/>
<line x1="788" y1="130" x2="788" y2="138" stroke="#333"/>
<line x1="804" y1="130" x2="804" y2="138" stroke="#333"/>
<line x1="820" y1="130" x2="820" y2="144" stroke="#333"/>
<rect x="660" y="130" width="16" height="30" fill="#d33" opacity="0.35"/>
<text x="740" y="210" font-size="11" fill="#333" text-anchor="middle">точность прецизионных пар</text>
<text x="740" y="226" font-size="11" fill="#333" text-anchor="middle">в топливной аппаратуре</text>
<text x="430" y="275" text-anchor="middle" font-size="12" fill="#555">Каждый шаг вправо: в 10 раз меньше. Масляный зазор вкладыша порядка 0,05–0,15 мм (~пример): это 5–15 соток, тоньше двух листов бумаги.</text>
<line x1="20" y1="295" x2="840" y2="295" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="30" y="322" font-size="15" font-weight="bold" fill="#222">Приставки: что означают буквы перед единицей</text>
<text x="42" y="356" font-size="13" fill="#222" font-weight="bold">Приставка</text><text x="160" y="356" font-size="13" fill="#222" font-weight="bold">Значит</text><text x="380" y="356" font-size="13" fill="#222" font-weight="bold">Пример</text>
<rect x="30" y="364" width="560" height="26" fill="#f4f6f8"/>
<text x="42" y="382" font-size="13" fill="#222">мк (микро)</text><text x="160" y="382" font-size="13" fill="#222">одна миллионная (×0,000001)</text><text x="380" y="382" font-size="13" fill="#222">1 мкм = 0,001 мм</text>
<text x="42" y="408" font-size="13" fill="#222">м (милли)</text><text x="160" y="408" font-size="13" fill="#222">одна тысячная (×0,001)</text><text x="380" y="408" font-size="13" fill="#222">1 мм = 0,001 м; 1 мл = 0,001 л</text>
<rect x="30" y="416" width="560" height="26" fill="#f4f6f8"/>
<text x="42" y="434" font-size="13" fill="#222">с (санти)</text><text x="160" y="434" font-size="13" fill="#222">одна сотая (×0,01)</text><text x="380" y="434" font-size="13" fill="#222">1 см = 10 мм</text>
<text x="42" y="460" font-size="13" fill="#222">к (кило)</text><text x="160" y="460" font-size="13" fill="#222">тысяча (×1000)</text><text x="380" y="460" font-size="13" fill="#222">1 кН = 1000 Н; 1 кПа = 1000 Па</text>
<rect x="30" y="468" width="560" height="26" fill="#f4f6f8"/>
<text x="42" y="486" font-size="13" fill="#222">М (мега)</text><text x="160" y="486" font-size="13" fill="#222">миллион (×1 000 000)</text><text x="380" y="486" font-size="13" fill="#222">1 МПа = 1 000 000 Па = 10 бар</text>
<rect x="30" y="338" width="560" height="156" fill="none" stroke="#999"/>
<rect x="610" y="338" width="230" height="156" rx="8" fill="#fdecea" stroke="#d33"/>
<text x="622" y="360" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Осторожно: регистр!</text>
<text x="622" y="376" font-size="12" fill="#222" text-anchor="start">м (маленькая) = милли</text>
<text x="622" y="392" font-size="12" fill="#222" text-anchor="start">М (большая) = мега</text>
<text x="622" y="408" font-size="12" fill="#222" text-anchor="start">мПа и МПа отличаются</text>
<text x="622" y="424" font-size="12" fill="#222" text-anchor="start">в миллиард раз.</text>
<text x="622" y="440" font-size="12" fill="#222" text-anchor="start">мк перед м: «мкм»,</text>
<text x="622" y="456" font-size="12" fill="#222" text-anchor="start">а не «мм».</text>
<line x1="20" y1="512" x2="840" y2="512" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="30" y="538" font-size="15" font-weight="bold" fill="#222">Запятая решает всё</text>
<text x="40" y="572" font-size="22" font-weight="bold" fill="#2f6db5">0,5 мм</text>
<text x="40" y="594" font-size="12" fill="#222">пол-миллиметра = 50 соток</text>
<text x="310" y="572" font-size="22" font-weight="bold" fill="#e59a14">0,05 мм</text>
<text x="310" y="594" font-size="12" fill="#222">5 соток (в 10 раз меньше!)</text>
<text x="580" y="572" font-size="22" font-weight="bold" fill="#d33">0,005 мм</text>
<text x="580" y="594" font-size="12" fill="#222">5 мкм (в 100 раз меньше)</text>
<text x="30" y="625" font-size="12" fill="#555">В импортных документах вместо запятой пишут точку: 0.05 mm = 0,05 мм. Дюйм: 1" = 25,4 мм.</text>
</svg>