<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff" rx="10"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Порядок затяжки: от центра наружу и «крест-накрест»</text>

  <!-- Левая: крышка с двумя рядами болтов -->
  <g transform="translate(20 50)">
    <rect x="0" y="40" width="400" height="160" rx="10" fill="#dfe5ea" stroke="#333" stroke-width="3"/>
    <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Длинная крышка / головка (2 ряда по 5)</text>
    <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
      <!-- верхний ряд x: 50,125,200,275,350 ; y=85 ; нижний y=155 -->
      <circle cx="50" cy="85" r="19" fill="#3d7ab8"/><text x="50" y="91">7</text>
      <circle cx="125" cy="85" r="19" fill="#3d7ab8"/><text x="125" y="91">3</text>
      <circle cx="200" cy="85" r="19" fill="#d33"/><text x="200" y="91">1</text>
      <circle cx="275" cy="85" r="19" fill="#3d7ab8"/><text x="275" y="91">5</text>
      <circle cx="350" cy="85" r="19" fill="#3d7ab8"/><text x="350" y="91">9</text>
      <circle cx="50" cy="155" r="19" fill="#3d7ab8"/><text x="50" y="161">10</text>
      <circle cx="125" cy="155" r="19" fill="#3d7ab8"/><text x="125" y="161">6</text>
      <circle cx="200" cy="155" r="19" fill="#d33"/><text x="200" y="161">2</text>
      <circle cx="275" cy="155" r="19" fill="#3d7ab8"/><text x="275" y="161">4</text>
      <circle cx="350" cy="155" r="19" fill="#3d7ab8"/><text x="350" y="161">8</text>
    </g>
    <text x="200" y="230" text-anchor="middle" font-size="13" fill="#333">Начинаем с центра, расходимся в стороны, чередуя стороны.</text>
    <text x="200" y="248" text-anchor="middle" font-size="13" fill="#333">Так деталь не «перекашивает», прокладка сжимается ровно.</text>
  </g>

  <!-- Правая: круглый фланец, 6 болтов крест-накрест -->
  <g transform="translate(470 50)">
    <circle cx="150" cy="120" r="100" fill="#dfe5ea" stroke="#333" stroke-width="3"/>
    <circle cx="150" cy="120" r="38" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <text x="150" y="10" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Круглый фланец (6 болтов)</text>
    <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="150" cy="47" r="19" fill="#d33"/><text x="150" y="53">1</text>
      <circle cx="213" cy="83" r="19" fill="#3d7ab8"/><text x="213" y="89">3</text>
      <circle cx="213" cy="157" r="19" fill="#3d7ab8"/><text x="213" y="163">5</text>
      <circle cx="150" cy="193" r="19" fill="#d33"/><text x="150" y="199">2</text>
      <circle cx="87" cy="157" r="19" fill="#3d7ab8"/><text x="87" y="163">4</text>
      <circle cx="87" cy="83" r="19" fill="#3d7ab8"/><text x="87" y="89">6</text>
    </g>
    <text x="150" y="235" text-anchor="middle" font-size="13" fill="#333">1 и 2 напротив друг друга,</text>
    <text x="150" y="253" text-anchor="middle" font-size="13" fill="#333">затем 3 и 4, затем 5 и 6.</text>
  </g>

  <text x="390" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Каждый круг повторяют: сначала ~30%, потом ~60–70%, потом 100% момента (~пример)</text>
  <text x="390" y="362" text-anchor="middle" font-size="12" fill="#555">Точный порядок и проходы для вашей детали всегда указаны в технологической карте. Это только принцип.</text>
</svg>
