<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Arial, sans-serif">
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 Z" fill="#d33"/></marker></defs>
<rect width="860" height="420" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Основные сигналы крановщику (знать должны все на участке)</text>
<text x="80" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Поднять груз</text>
<circle cx="80" cy="110" r="14" fill="#ffe0b2" stroke="#222" stroke-width="3"/>
<rect x="66" y="96" width="28" height="7" fill="#fdd835" stroke="#222"/>
<line x1="80" y1="124" x2="80" y2="200" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="80" y1="200" x2="64" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/><line x1="80" y1="200" x2="96" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="80" y1="138" x2="62" y2="195" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<polyline points="80,138 108,170 114,138" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="110" y1="132" x2="120" y2="132" stroke="#222" stroke-width="4"/>
<line x1="136" y1="165" x2="136" y2="115" stroke="#d33" stroke-width="3" marker-end="url(#m)"/>
<text x="80" y="285" text-anchor="middle" font-size="12" fill="#222">прерывистые движения</text>
<text x="80" y="300" text-anchor="middle" font-size="12" fill="#222">руки вверх перед грудью,</text>
<text x="80" y="315" text-anchor="middle" font-size="12" fill="#222">ладонь вверх, рука</text>
<text x="80" y="330" text-anchor="middle" font-size="12" fill="#222">согнута в локте</text>
<text x="248" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Опустить груз</text>
<circle cx="248" cy="110" r="14" fill="#ffe0b2" stroke="#222" stroke-width="3"/>
<rect x="234" y="96" width="28" height="7" fill="#fdd835" stroke="#222"/>
<line x1="248" y1="124" x2="248" y2="200" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="248" y1="200" x2="232" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/><line x1="248" y1="200" x2="264" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="248" y1="138" x2="230" y2="195" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<polyline points="248,138 276,170 282,138" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="278" y1="136" x2="288" y2="136" stroke="#222" stroke-width="4"/>
<line x1="304" y1="120" x2="304" y2="170" stroke="#d33" stroke-width="3" marker-end="url(#m)"/>
<text x="248" y="285" text-anchor="middle" font-size="12" fill="#222">прерывистые движения</text>
<text x="248" y="300" text-anchor="middle" font-size="12" fill="#222">руки вниз перед грудью,</text>
<text x="248" y="315" text-anchor="middle" font-size="12" fill="#222">ладонь вниз, рука</text>
<text x="248" y="330" text-anchor="middle" font-size="12" fill="#222">согнута в локте</text>
<text x="416" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#d33">СТОП</text>
<circle cx="416" cy="110" r="14" fill="#ffe0b2" stroke="#222" stroke-width="3"/>
<rect x="402" y="96" width="28" height="7" fill="#fdd835" stroke="#222"/>
<line x1="416" y1="124" x2="416" y2="200" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="416" y1="200" x2="400" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/><line x1="416" y1="200" x2="432" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="416" y1="138" x2="398" y2="195" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<polyline points="416,138 438,175 471,175" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="436" y1="192" x2="491" y2="192" stroke="#d33" stroke-width="3" marker-start="url(#m)" marker-end="url(#m)"/>
<text x="416" y="285" text-anchor="middle" font-size="12" fill="#222">резкие движения рукой</text>
<text x="416" y="300" text-anchor="middle" font-size="12" fill="#222">вправо-влево на уровне</text>
<text x="416" y="315" text-anchor="middle" font-size="12" fill="#222">пояса, ладонь вниз</text>
<text x="584" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Осторожно</text>
<circle cx="584" cy="110" r="14" fill="#ffe0b2" stroke="#222" stroke-width="3"/>
<rect x="570" y="96" width="28" height="7" fill="#fdd835" stroke="#222"/>
<line x1="584" y1="124" x2="584" y2="200" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="584" y1="200" x2="568" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/><line x1="584" y1="200" x2="600" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<polyline points="584,138 558,120 576,82" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<polyline points="584,138 610,120 592,82" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<text x="584" y="285" text-anchor="middle" font-size="12" fill="#222">обе руки подняты,</text>
<text x="584" y="300" text-anchor="middle" font-size="12" fill="#222">ладони смотрят друг</text>
<text x="584" y="315" text-anchor="middle" font-size="12" fill="#222">на друга на небольшом</text>
<text x="584" y="330" text-anchor="middle" font-size="12" fill="#222">расстоянии</text>
<text x="752" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Передвинуть кран</text>
<circle cx="752" cy="110" r="14" fill="#ffe0b2" stroke="#222" stroke-width="3"/>
<rect x="738" y="96" width="28" height="7" fill="#fdd835" stroke="#222"/>
<line x1="752" y1="124" x2="752" y2="200" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="752" y1="200" x2="736" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/><line x1="752" y1="200" x2="768" y2="255" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="752" y1="138" x2="734" y2="195" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="752" y1="138" x2="812" y2="138" stroke="#222" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="782" y1="158" x2="827" y2="158" stroke="#d33" stroke-width="3" marker-end="url(#m)"/>
<text x="752" y="285" text-anchor="middle" font-size="12" fill="#222">вытянутой рукой,</text>
<text x="752" y="300" text-anchor="middle" font-size="12" fill="#222">ладонь в сторону</text>
<text x="752" y="315" text-anchor="middle" font-size="12" fill="#222">нужного движения</text>
<text x="430" y="378" text-anchor="middle" font-size="12" fill="#555">Сигналы подаёт стропальщик. Команду «СТОП» обязан выполнить крановщик, кто бы её ни подал.</text>
<text x="430" y="396" text-anchor="middle" font-size="12" fill="#555">Рисунок упрощён: точный вид сигналов сверьте с плакатом на вашем участке и с инструкцией предприятия.</text>
</svg>