<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="Arial, sans-serif">
  <rect width="760" height="510" fill="#ffffff" rx="10"/>
  <text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Блок цилиндров с мокрой гильзой (разрез одного цилиндра)</text>

  <!-- головка -->
  <rect x="190" y="40" width="320" height="45" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="50" x2="300" y2="92" stroke="#222" stroke-width="5"/>
  <line x1="400" y1="50" x2="400" y2="92" stroke="#222" stroke-width="5"/>
  <rect x="342" y="34" width="16" height="56" fill="#e59a14" stroke="#333" stroke-width="2"/>
  <!-- прокладка -->
  <rect x="190" y="85" width="320" height="5" fill="#333"/>
  <!-- блок -->
  <rect x="190" y="90" width="320" height="240" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
  <rect x="190" y="330" width="30" height="110" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
  <rect x="480" y="330" width="30" height="110" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
  <!-- рубашка воды -->
  <rect x="205" y="100" width="40" height="190" fill="#8ec6f0" stroke="#3d8fd1"/>
  <rect x="455" y="100" width="40" height="190" fill="#8ec6f0" stroke="#3d8fd1"/>
  <!-- гильза -->
  <rect x="245" y="88" width="22" height="215" fill="#7d8a96" stroke="#333" stroke-width="2"/>
  <rect x="433" y="88" width="22" height="215" fill="#7d8a96" stroke="#333" stroke-width="2"/>
  <rect x="267" y="90" width="166" height="240" fill="#ffffff"/>
  <!-- кольца уплотнения гильзы -->
  <circle cx="246" cy="296" r="5" fill="#d33"/><circle cx="454" cy="296" r="5" fill="#d33"/>
  <!-- поршень -->
  <rect x="280" y="150" width="140" height="75" fill="#6c7a89" stroke="#222" stroke-width="2"/>
  <rect x="278" y="160" width="144" height="5" fill="#d33"/>
  <rect x="278" y="172" width="144" height="5" fill="#d33"/>
  <rect x="278" y="190" width="144" height="6" fill="#e59a14"/>
  <circle cx="350" cy="210" r="9" fill="#fff" stroke="#222" stroke-width="2"/>
  <!-- коленвал: щека с противовесом, коренная шейка в центре -->
  <circle cx="350" cy="400" r="45" fill="#f8d48a" stroke="#333" stroke-width="2"/>
  <path d="M 314 427 A 45 45 0 0 0 386 427 Z" fill="#e8b04a" stroke="#333" stroke-width="1.5"/>
  <circle cx="350" cy="400" r="9" fill="#555" stroke="#222" stroke-width="2"/>
  <!-- шатун идёт на смещённую шатунную шейку, а не в центр вала -->
  <line x1="350" y1="210" x2="372" y2="372" stroke="#222" stroke-width="14" stroke-linecap="round"/>
  <circle cx="372" cy="372" r="11" fill="#e59a14" stroke="#222" stroke-width="2"/>
  <!-- поддон -->
  <path d="M 190 440 L 510 440 L 480 495 L 220 495 Z" fill="#f6e27a" stroke="#333" stroke-width="2"/>
  <text x="350" y="475" text-anchor="middle" font-size="12" fill="#333">масло</text>

  <g font-size="13" fill="#222" stroke="#333">
    <text x="12" y="62" stroke="none">Головка блока</text>
    <line x1="105" y1="58" x2="192" y2="62"/><circle cx="192" cy="62" r="3"/>
    <text x="12" y="112" stroke="none">Прокладка головки</text>
    <line x1="132" y1="108" x2="195" y2="88"/><circle cx="195" cy="88" r="3"/>
    <text x="12" y="200" stroke="none">Рубашка охлаждения</text>
    <text x="12" y="216" stroke="none">(вода вокруг гильзы)</text>
    <line x1="150" y1="198" x2="225" y2="198"/><circle cx="225" cy="198" r="3"/>
    <text x="12" y="326" stroke="none">Резиновые кольца</text>
    <text x="12" y="342" stroke="none">гильзы (низ)</text>
    <line x1="110" y1="322" x2="242" y2="298"/><circle cx="242" cy="298" r="3"/>
    <text x="748" y="122" text-anchor="end" stroke="none">Гильза</text>
    <line x1="700" y1="118" x2="444" y2="122"/><circle cx="444" cy="122" r="3"/>
    <text x="748" y="152" text-anchor="end" stroke="none">Поршневые кольца</text>
    <line x1="640" y1="150" x2="422" y2="163"/><circle cx="422" cy="163" r="3"/>
    <text x="748" y="228" text-anchor="end" stroke="none">Поршень</text>
    <line x1="700" y1="224" x2="418" y2="215"/><circle cx="418" cy="215" r="3"/>
    <text x="748" y="300" text-anchor="end" stroke="none">Шатун</text>
    <line x1="700" y1="296" x2="370" y2="300"/><circle cx="370" cy="300" r="3"/>
    <text x="748" y="414" text-anchor="end" stroke="none">Коленчатый вал</text>
    <text x="748" y="390" text-anchor="end" stroke="none">Шатунная шейка</text>
    <line x1="650" y1="386" x2="384" y2="372"/><circle cx="384" cy="372" r="3"/>
    <line x1="640" y1="410" x2="390" y2="410"/><circle cx="390" cy="410" r="3"/>
    <text x="748" y="360" text-anchor="end" stroke="none">Блок цилиндров</text>
    <line x1="660" y1="356" x2="508" y2="356"/><circle cx="508" cy="356" r="3"/>
    <text x="748" y="480" text-anchor="end" stroke="none">Масляный поддон</text>
    <line x1="640" y1="476" x2="490" y2="476"/><circle cx="490" cy="476" r="3"/>
  </g>
</svg>
