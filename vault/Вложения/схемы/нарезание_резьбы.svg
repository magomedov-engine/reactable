<text x="250" y="262" text-anchor="middle" font-size="11" fill="#222">№3 чистовой</text>
<text x="40" y="285" font-size="11" fill="#555">Красные риски на хвостовике = номер. Резать по порядку 1 → 2 → 3.</text>
<text x="40" y="300" font-size="11" fill="#555">У черновика длинный конус (заборная часть): он легче заходит.</text>
<rect x="335" y="110" width="110" height="10" rx="4" fill="#8d6e63" stroke="#333"/><rect x="370" y="104" width="40" height="22" fill="#6c7a89" stroke="#333"/><rect x="384" y="109" width="12" height="12" fill="#fff" stroke="#333"/>
<text x="390" y="145" text-anchor="middle" font-size="11" fill="#222">вороток</text>
<text x="500" y="62" font-size="14" font-weight="bold" fill="#222">Сверло под резьбу (метрическая)</text>
<text x="500" y="82" font-size="12" fill="#222">Правило: <tspan font-weight="bold">сверло ≈ диаметр − шаг</tspan>. M10: 10 − 1,5 = 8,5</text>
<text x="515" y="115" font-size="12" fill="#222" font-weight="bold">Резьба</text><text x="630" y="115" font-size="12" fill="#222" font-weight="bold">Шаг</text><text x="720" y="115" font-size="12" fill="#222" font-weight="bold">Сверло</text>
<rect x="500" y="121" width="300" height="21" fill="#f4f6f8"/>
<text x="515" y="136" font-size="12" fill="#222">M5</text><text x="630" y="136" font-size="12" fill="#222">0,8</text><text x="720" y="136" font-size="12" fill="#222">4,2</text>
<text x="515" y="157" font-size="12" fill="#222">M6</text><text x="630" y="157" font-size="12" fill="#222">1</text><text x="720" y="157" font-size="12" fill="#222">5,0</text>
<rect x="500" y="163" width="300" height="21" fill="#f4f6f8"/>
<text x="515" y="178" font-size="12" fill="#222">M8</text><text x="630" y="178" font-size="12" fill="#222">1,25</text><text x="720" y="178" font-size="12" fill="#222">6,8</text>
<text x="515" y="199" font-size="12" fill="#222">M10</text><text x="630" y="199" font-size="12" fill="#222">1,5</text><text x="720" y="199" font-size="12" fill="#222">8,5</text>
<rect x="500" y="205" width="300" height="21" fill="#f4f6f8"/>
<text x="515" y="220" font-size="12" fill="#222">M12</text><text x="630" y="220" font-size="12" fill="#222">1,75</text><text x="720" y="220" font-size="12" fill="#222">10,2</text>
<text x="515" y="241" font-size="12" fill="#222">M16</text><text x="630" y="241" font-size="12" fill="#222">2</text><text x="720" y="241" font-size="12" fill="#222">14,0</text>
<rect x="500" y="247" width="300" height="21" fill="#f4f6f8"/>
<text x="515" y="262" font-size="12" fill="#222">M12×1,5</text><text x="630" y="262" font-size="12" fill="#222">1,5</text><text x="720" y="262" font-size="12" fill="#222">10,5</text>
<text x="515" y="283" font-size="12" fill="#222">M16×1,5</text><text x="630" y="283" font-size="12" fill="#222">1,5</text><text x="720" y="283" font-size="12" fill="#222">14,5</text>
<rect x="500" y="100" width="300" height="189" fill="none" stroke="#999"/>
<text x="500" y="306" font-size="11" fill="#555">Две нижние строки: мелкий шаг (он указан в обозначении).</text>
<line x1="20" y1="322" x2="840" y2="322" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="40" y="348" font-size="14" font-weight="bold" fill="#222">Как крутить</text>
<path d="M 101.2 378.3 A 55 55 0 0 1 147.5 477.6" fill="none" stroke="#2a8a3a" stroke-width="5" marker-end="url(#g)"/>
<path d="M 126.4 466.4 A 37 37 0 0 0 156.4 423.6" fill="none" stroke="#d33" stroke-width="4" marker-end="url(#r)"/>
<circle cx="120" cy="430" r="10" fill="#6c7a89"/>
<text x="190" y="400" font-size="12" fill="#2a8a3a" font-weight="bold">½ оборота вперёд,</text>
<text x="190" y="418" font-size="12" fill="#d33" font-weight="bold">¼ оборота назад</text>
<text x="190" y="440" font-size="11" fill="#555">назад: ломаем стружку,</text><text x="190" y="454" font-size="11" fill="#555">чтобы метчик не заклинило</text>
<text x="40" y="520" font-size="11" fill="#555">Смазка: масло (по ТК). Пошло туго: не давить,</text><text x="40" y="534" font-size="11" fill="#555">вывернуть и очистить. Сломанный метчик</text><text x="40" y="548" font-size="11" fill="#555">из отверстия достать очень трудно.</text>
<text x="390" y="348" font-size="14" font-weight="bold" fill="#222">Метчик строго перпендикулярно</text>
<rect x="390" y="470" width="200" height="60" fill="url(#h)" stroke="#333"/>
<rect x="482" y="470" width="16" height="60" fill="#fff" stroke="#333"/>
<rect x="482" y="380" width="16" height="95" fill="#cfd6dc" stroke="#333"/>
<path d="M 410 470 L 410 390 L 418 390 L 418 462 L 470 462 L 470 470 Z" fill="#f2b84b" stroke="#333"/>
<text x="425" y="405" font-size="11" fill="#a06000">угольник</text>
<text x="390" y="555" font-size="11" fill="#222">Угольник прикладывают</text>
<text x="390" y="569" font-size="11" fill="#222">с двух сторон (под 90°</text>
<text x="390" y="583" font-size="11" fill="#222">друг к другу) после</text>
<text x="390" y="597" font-size="11" fill="#222">первых 2–3 оборотов</text>
<text x="530" y="555" font-size="11" fill="#d33">Глухое отверстие:</text>
<text x="530" y="569" font-size="11" fill="#222">сверлят глубже резьбы,</text>
<text x="530" y="583" font-size="11" fill="#222">в дно не упираться,</text>
<text x="530" y="597" font-size="11" fill="#222">стружку вытряхивать</text>
<line x1="665" y1="335" x2="665" y2="645" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="680" y="348" font-size="14" font-weight="bold" fill="#222">Плашка: наружная</text>
<text x="680" y="364" font-size="14" font-weight="bold" fill="#222">резьба на стержне</text>
<circle cx="760" cy="425" r="45" fill="#b7c2cc" stroke="#333" stroke-width="2"/><circle cx="760" cy="425" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="781.2" cy="446.2" r="7" fill="#fff" stroke="#333"/>
<circle cx="738.8" cy="446.2" r="7" fill="#fff" stroke="#333"/>
<circle cx="738.8" cy="403.8" r="7" fill="#fff" stroke="#333"/>
<circle cx="781.2" cy="403.8" r="7" fill="#fff" stroke="#333"/>
<rect x="690" y="419" width="25" height="12" fill="#8d6e63" stroke="#333"/><rect x="805" y="419" width="25" height="12" fill="#8d6e63" stroke="#333"/>
<text x="760" y="488" text-anchor="middle" font-size="11" fill="#222">плашка в плашкодержателе</text>
<rect x="740" y="515" width="40" height="70" fill="#cfd6dc" stroke="#333"/><path d="M 740 515 L 746 505 L 774 505 L 780 515 Z" fill="#cfd6dc" stroke="#333"/>
<text x="790" y="512" font-size="10" fill="#555">фаска</text>
<text x="680" y="602" font-size="11" fill="#222">Стержень чуть тоньше резьбы</text>
<text x="680" y="616" font-size="11" fill="#222">(~на 0,1–0,2 мм, ~пример).</text>
<text x="680" y="630" font-size="11" fill="#222">Крутить так же: ½ вперёд,</text>
<text x="680" y="644" font-size="11" fill="#222">¼ назад, с маслом.</text>
