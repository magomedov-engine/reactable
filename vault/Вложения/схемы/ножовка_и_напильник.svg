<text x="40" y="520" font-size="11" fill="#555">Без ручки напильником не работают: хвостовик пробьёт ладонь.</text>
<text x="40" y="536" font-size="11" fill="#555">Забитую насечку чистят щёткой, а не стучат напильником.</text>
