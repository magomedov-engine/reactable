<line x1="835" y1="334" x2="835" y2="362" stroke="#d33" stroke-width="2.7" marker-end="url(#m)"/>
<text x="780" y="440" text-anchor="middle" font-size="12" fill="#222">конец хода</text>
<text x="480" y="300" font-size="11" fill="#555">ручка слева, носок справа; ход вправо →</text>
<text x="460" y="470" font-size="12" fill="#222">Начало: сильнее давит рука на носке напильника.</text>
<text x="460" y="487" font-size="12" fill="#222">Середина: поровну. Конец: сильнее рука на ручке.</text>
<text x="460" y="504" font-size="12" fill="#222">Рабочий ход вперёд, назад без нажима.</text>
<text x="460" y="530" font-size="12" fill="#555">Проверка: лекальная линейка или угольник на просвет:</text>
<text x="460" y="546" font-size="12" fill="#555">ровная щель света = плоско; свет по краям = завал.</text>
<line x1="20" y1="568" x2="840" y2="568" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="40" y="592" font-size="13" font-weight="bold" fill="#222">Высота тисков:</text>
<text x="150" y="592" font-size="12" fill="#222">согнутую руку ставят локтем на губки тисков: кулак должен доставать до подбородка.</text>
<text x="40" y="616" font-size="12" fill="#222">Деталь зажимают так, чтобы обрабатываемое место выступало над губками на 5–10 мм (~пример). Точные поверхности: через мягкие накладки.</text>
