<text x="660" y="440" text-anchor="middle" font-size="12" fill="#222">середина</text>
<rect x="755" y="380" width="50" height="40" fill="#f2b84b" stroke="#333"/>
<rect x="755" y="366" width="90" height="12" fill="#b7c2cc" stroke="#333"/><rect x="727" y="364" width="28" height="16" rx="6" fill="#8d6e63" stroke="#333"/>
