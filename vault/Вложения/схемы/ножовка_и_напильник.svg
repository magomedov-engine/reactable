<text x="300" y="210" font-size="12" fill="#2a8a3a">рабочий ход: ОТ СЕБЯ, с нажимом</text>
<text x="300" y="226" font-size="12" fill="#555">обратно: без нажима</text>
<text x="90" y="182" font-size="11" fill="#d33">зубья смотрят вперёд →</text>
<text x="560" y="75" font-size="12" fill="#222">• полотно натянуто, не «играет»;</text>
<text x="560" y="93" font-size="12" fill="#222">• работать всей длиной полотна;</text>
<text x="560" y="111" font-size="12" fill="#222">• темп ~30–60 двойных ходов в мин;</text>
<text x="560" y="129" font-size="12" fill="#222">• в работе не меньше 2–3 зубьев;</text>
<text x="560" y="147" font-size="12" fill="#222">• в конце реза нажим ослабить.</text>
