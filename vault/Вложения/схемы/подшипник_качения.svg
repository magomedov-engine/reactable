<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" font-family="Arial, sans-serif">
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker></defs>
<rect width="860" height="660" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Подшипник качения: устройство, типы, маркировка</text>
<circle cx="190" cy="210" r="120" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="190" cy="210" r="100" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="190" cy="210" r="85" fill="none" stroke="#2f6db5" stroke-width="6" opacity="0.5"/>
<circle cx="275.0" cy="210.0" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="255.1" cy="264.6" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="204.8" cy="293.7" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="147.5" cy="283.6" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="110.1" cy="239.1" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="110.1" cy="180.9" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="147.5" cy="136.4" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="204.8" cy="126.3" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="255.1" cy="155.4" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="190" cy="210" r="70" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="190" cy="210" r="52" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="190" y="214" text-anchor="middle" font-size="11" fill="#555">место вала</text>
<g font-size="12" fill="#222" stroke="#555">
<text x="330" y="80" stroke="none">Наружное кольцо: сидит в корпусе</text><line x1="328" y1="84" x2="270" y2="122"/>
<text x="330" y="140" stroke="none" fill="#b26a00">Тела качения (шарики/ролики)</text><line x1="328" y1="144" x2="260" y2="170"/>
<text x="330" y="200" stroke="none" fill="#2f6db5">Сепаратор: держит шарики на равном шаге</text><line x1="328" y1="204" x2="276" y2="220" stroke="#2f6db5"/>
<text x="330" y="260" stroke="none">Внутреннее кольцо: сидит на валу</text><line x1="328" y1="264" x2="245" y2="240"/>
</g>
<text x="330" y="300" font-size="12" fill="#555">Обычно одно кольцо крутится вместе с валом, а другое стоит.</text>
<text x="330" y="316" font-size="12" fill="#555">Шарики катятся между ними: трение очень маленькое.</text>
<rect x="610" y="60" width="230" height="200" rx="8" fill="#fff8e1" stroke="#e59a14"/>
<text x="622" y="82" font-size="12" fill="#222" font-weight="bold">Маркировка: пример 6205</text>
<text x="622" y="100" font-size="12" fill="#222">Две последние цифры × 5 =</text>
<text x="622" y="118" font-size="12" fill="#222">внутренний диаметр (мм):</text>
<text x="622" y="136" font-size="12" fill="#222" font-weight="bold">05 × 5 = 25 мм.</text>
<text x="622" y="154" font-size="12" fill="#222">Исключения:</text>
<text x="622" y="172" font-size="12" fill="#222">00 = 10, 01 = 12,</text>
<text x="622" y="190" font-size="12" fill="#222">02 = 15, 03 = 17 мм.</text>
<text x="622" y="208" font-size="12" fill="#222">Первые цифры: тип и серия.</text>
<text x="622" y="226" font-size="12" fill="#222">Ставьте только номер из ТК:</text>
<text x="622" y="244" font-size="12" fill="#222">«похожий» не годится.</text>
<line x1="20" y1="345" x2="840" y2="345" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="430" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Основные типы (разрез одной стороны) и какую нагрузку держат</text>
<rect x="50" y="390" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="50" y="470" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="85" cy="440" r="29" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<text x="85" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Шариковый</text>
<text x="85" y="531" text-anchor="middle" font-size="12" fill="#222">радиальный</text>
<text x="85" y="552" text-anchor="middle" font-size="12" fill="#d33">↓ радиальную</text><text x="85" y="567" text-anchor="middle" font-size="12" fill="#d33">и немного осевую</text>
<rect x="210" y="390" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="210" y="470" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="222" y="412" width="46" height="56" rx="3" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<text x="245" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Роликовый</text>
<text x="245" y="531" text-anchor="middle" font-size="12" fill="#222">цилиндрический</text>
<text x="245" y="552" text-anchor="middle" font-size="12" fill="#d33">↓↓ большую</text><text x="245" y="567" text-anchor="middle" font-size="12" fill="#d33">радиальную</text>
<rect x="370" y="390" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="370" y="470" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<polygon points="384,415 420,408 428,468 382,464" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<text x="405" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Конический</text>
<text x="405" y="531" text-anchor="middle" font-size="12" fill="#222">(ставят парой)</text>
<text x="405" y="552" text-anchor="middle" font-size="12" fill="#d33">↓ радиальную</text><text x="405" y="567" text-anchor="middle" font-size="12" fill="#d33">→ и осевую</text>
<rect x="530" y="390" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="530" y="470" width="70" height="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="540" y="412" width="12" height="56" rx="5" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="558" y="412" width="12" height="56" rx="5" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="576" y="412" width="12" height="56" rx="5" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<text x="565" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Игольчатый</text>
<text x="565" y="552" text-anchor="middle" font-size="12" fill="#d33">↓ радиальную,</text><text x="565" y="567" text-anchor="middle" font-size="12" fill="#d33">мало места</text>
<rect x="690" y="390" width="20" height="100" fill="#b7c2cc" stroke="#333" stroke-width="2"/><rect x="740" y="390" width="20" height="100" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="725" cy="415" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<circle cx="725" cy="465" r="14" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<text x="725" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Упорный</text>
<text x="725" y="552" text-anchor="middle" font-size="12" fill="#d33">→ только</text><text x="725" y="567" text-anchor="middle" font-size="12" fill="#d33">осевую</text>
<text x="430" y="600" text-anchor="middle" font-size="12" fill="#555">↓ радиальная нагрузка: поперёк вала (вес, натяжение ремня). → осевая: вдоль вала (сдвигает вал).</text>
<text x="430" y="618" text-anchor="middle" font-size="12" fill="#555">Вкладыши коленвала из уроков 9–10 тоже подшипники, но скольжения: там вал скользит по масляной плёнке.</text>
<text x="430" y="644" text-anchor="middle" font-size="11" fill="#999">Схемы упрощены. Конические подшипники при сборке регулируют (натяг или зазор задаёт ТК).</text>
</svg>