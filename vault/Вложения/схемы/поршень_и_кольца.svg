<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Arial, sans-serif">
  <rect width="760" height="350" fill="#ffffff" rx="10"/>
  <text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Поршень, кольца и «замки» колец</text>

  <!-- поршень -->
  <rect x="70" y="55" width="140" height="230" fill="#9aa5b1" stroke="#222" stroke-width="3"/>
  <rect x="70" y="55" width="140" height="18" fill="#6c7a89"/>
  <rect x="64" y="84" width="152" height="9" fill="#d33" stroke="#222"/>
  <rect x="64" y="104" width="152" height="9" fill="#d33" stroke="#222"/>
  <rect x="64" y="128" width="152" height="12" fill="#e59a14" stroke="#222"/>
  <circle cx="140" cy="215" r="20" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <text x="140" y="219" text-anchor="middle" font-size="11" fill="#222">палец</text>
  <text x="140" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Вид сбоку</text>

  <g font-size="13" fill="#222" stroke="#333">
    <text x="245" y="92" stroke="none">Компрессионное кольцо 1 (верхнее)</text>
    <line x1="218" y1="89" x2="242" y2="89"/>
    <text x="245" y="112" stroke="none">Компрессионное кольцо 2</text>
    <line x1="218" y1="109" x2="242" y2="109"/>
    <text x="245" y="138" stroke="none">Маслосъёмное кольцо</text>
    <line x1="218" y1="134" x2="242" y2="134"/>
    <text x="245" y="222" stroke="none">Поршневой палец (соединяет с шатуном)</text>
    <line x1="162" y1="215" x2="242" y2="218"/>
  </g>
  <text x="245" y="160" font-size="12" fill="#555">Компрессионные удерживают газы, маслосъёмное</text>
  <text x="245" y="176" font-size="12" fill="#555">снимает лишнее масло со стенки гильзы.</text>

  <!-- замки колец, вид сверху -->
  <line x1="30" y1="310" x2="730" y2="310" stroke="#ddd"/>
  <text x="380" y="336" text-anchor="middle" font-size="12" fill="#555">При установке замки (разрезы) колец разводят: нельзя, чтобы они совпадали. Углы и порядок смотрите в ТК.</text>
  <g transform="translate(625 215)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="0" cy="-70" r="8" fill="#d33"/><text x="0" y="-86" text-anchor="middle" font-size="12" fill="#222">замок 1</text>
    <circle cx="60.6" cy="35" r="8" fill="#d33"/><text x="102" y="45" text-anchor="middle" font-size="12" fill="#222">замок 2</text>
    <circle cx="-60.6" cy="35" r="8" fill="#e59a14"/><text x="-102" y="45" text-anchor="middle" font-size="12" fill="#222">масло</text>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#555">вид сверху</text>
    <text x="0" y="-108" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Замки разведены (~120°, пример)</text>
  </g>
</svg>
