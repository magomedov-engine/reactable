<text x="40" y="150" font-size="12" fill="#555">быстро, но держит только 2 грани:</text><text x="40" y="165" font-size="12" fill="#555">не для большого момента</text>
<rect x="300" y="92" width="140" height="18" rx="6" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="465" cy="101" r="30" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<polygon points="484.0,101.0 480.5,105.1 481.5,110.5 476.3,112.3 474.5,117.5 469.1,116.5 465.0,120.0 460.9,116.5 455.5,117.5 453.7,112.3 448.5,110.5 449.5,105.1 446.0,101.0 449.5,96.9 448.5,91.5 453.7,89.7 455.5,84.5 460.9,85.5 465.0,82.0 469.1,85.5 474.5,84.5 476.3,89.7 481.5,91.5 480.5,96.9" fill="#fff" stroke="#333"/>
<text x="300" y="70" font-size="14" font-weight="bold" fill="#222">Накидной ключ</text>
<text x="300" y="150" font-size="12" fill="#555">охватывает гайку целиком:</text><text x="300" y="165" font-size="12" fill="#555">надёжнее рожкового</text>
<rect x="560" y="95" width="150" height="16" rx="6" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="725" cy="103" r="20" fill="#b7c2cc" stroke="#333" stroke-width="2"/><rect x="719" y="80" width="12" height="4" fill="#333"/>
<rect x="719" y="123" width="12" height="12" fill="#6c7a89" stroke="#333"/>
<rect x="711" y="135" width="28" height="38" rx="3" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<text x="560" y="70" font-size="14" font-weight="bold" fill="#222">Трещотка + торцевая головка</text>
<text x="745" y="132" font-size="11" fill="#555">квадрат</text><text x="745" y="160" font-size="11" fill="#555">головка</text>
<text x="560" y="190" font-size="12" fill="#555">главный инструмент: быстро и надёжно;</text><text x="560" y="205" font-size="12" fill="#555">переключатель меняет направление</text>
<polyline points="60,260 60,320 120,320" fill="none" stroke="#6c7a89" stroke-width="10" stroke-linejoin="round"/>
<text x="40" y="245" font-size="14" font-weight="bold" fill="#222">Шестигранник</text><text x="40" y="345" font-size="12" fill="#555">для винтов с шестигранным</text><text x="40" y="360" font-size="12" fill="#555">углублением; вставлять до упора</text>
<rect x="300" y="268" width="56" height="30" rx="4" fill="#d4874a" stroke="#333" stroke-width="2"/><rect x="323" y="298" width="10" height="55" fill="#a1887f" stroke="#333"/>
<rect x="380" y="268" width="56" height="30" rx="8" fill="#424242" stroke="#222" stroke-width="2"/><rect x="403" y="298" width="10" height="55" fill="#a1887f" stroke="#333"/>
<text x="300" y="245" font-size="14" font-weight="bold" fill="#222">Молотки: медный, резиновый</text><text x="300" y="375" font-size="12" fill="#555">мягкие: не оставляют забоин.</text><text x="300" y="390" font-size="12" fill="#555">Стальным по точным деталям нельзя</text>
<rect x="590" y="262" width="150" height="14" fill="#6c7a89" stroke="#333"/><rect x="658" y="230" width="14" height="70" fill="#9aa5b1" stroke="#333"/>
<path d="M 595 276 L 595 340 L 616 340" fill="none" stroke="#6c7a89" stroke-width="8"/><path d="M 735 276 L 735 340 L 714 340" fill="none" stroke="#6c7a89" stroke-width="8"/>
<rect x="652" y="300" width="26" height="62" fill="#d9dee3" stroke="#333"/><rect x="612" y="312" width="106" height="20" fill="#f2b84b" stroke="#333"/><text x="640" y="327" text-anchor="middle" font-size="10">шестерня</text><text x="690" y="358" font-size="10" fill="#555">вал</text>
<text x="590" y="245" font-size="14" font-weight="bold" fill="#222">Съёмник</text><text x="590" y="372" font-size="12" fill="#555">лапы цепляют деталь, винт давит</text><text x="590" y="387" font-size="12" fill="#555">в вал: деталь снимается ровно</text>
<line x1="20" y1="410" x2="840" y2="410" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="430" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Почему головка лучше рожка: куда давит ключ (вид на гайку сверху)</text>
<polygon points="184.0,505.0 167.0,534.4 133.0,534.4 116.0,505.0 133.0,475.6 167.0,475.6" fill="#e3e7eb" stroke="#333" stroke-width="2"/>
<rect x="90" y="471" width="120" height="10" fill="#9aa5b1" opacity="0.8"/><rect x="90" y="529" width="120" height="10" fill="#9aa5b1" opacity="0.8"/>
<circle cx="167" cy="476" r="6" fill="#d33"/>
<circle cx="133" cy="534" r="6" fill="#d33"/>
<text x="150" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#d33">Рожковый: давит на 2 угла</text><text x="150" y="583" text-anchor="middle" font-size="12" fill="#222">срывает грани под большим моментом</text>
<polygon points="464.0,505.0 447.0,534.4 413.0,534.4 396.0,505.0 413.0,475.6 447.0,475.6" fill="#e3e7eb" stroke="#333" stroke-width="2"/>
