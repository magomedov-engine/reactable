<circle cx="430.0" cy="533.0" r="5" fill="#2a8a3a"/>
<circle cx="405.8" cy="519.0" r="5" fill="#2a8a3a"/>
<circle cx="405.8" cy="491.0" r="5" fill="#2a8a3a"/>
<circle cx="430.0" cy="477.0" r="5" fill="#2a8a3a"/>
<circle cx="454.2" cy="491.0" r="5" fill="#2a8a3a"/>
<text x="430" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a8a3a">6-гранная головка: давит на плоскости</text><text x="430" y="583" text-anchor="middle" font-size="12" fill="#222">лучший вариант для затяжки</text>
<polygon points="744.0,505.0 727.0,534.4 693.0,534.4 676.0,505.0 693.0,475.6 727.0,475.6" fill="#e3e7eb" stroke="#333" stroke-width="2"/>
<polygon points="751.0,505.0 744.8,514.3 745.5,525.5 735.5,530.5 730.5,540.5 719.3,539.8 710.0,546.0 700.7,539.8 689.5,540.5 684.5,530.5 674.5,525.5 675.2,514.3 669.0,505.0 675.2,495.7 674.5,484.5 684.5,479.5 689.5,469.5 700.7,470.2 710.0,464.0 719.3,470.2 730.5,469.5 735.5,479.5 745.5,484.5 744.8,495.7" fill="none" stroke="#9aa5b1" stroke-width="5"/>
<circle cx="740.3" cy="511.4" r="5" fill="#e59a14"/>
<circle cx="719.6" cy="534.5" r="5" fill="#e59a14"/>
<circle cx="689.3" cy="528.0" r="5" fill="#e59a14"/>
<circle cx="679.7" cy="498.6" r="5" fill="#e59a14"/>
<circle cx="700.4" cy="475.5" r="5" fill="#e59a14"/>
<circle cx="730.7" cy="482.0" r="5" fill="#e59a14"/>
<text x="710" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#e59a14">12-гранная: ближе к углам</text><text x="710" y="583" text-anchor="middle" font-size="12" fill="#222">удобнее надевать, но держит хуже</text>
</svg>