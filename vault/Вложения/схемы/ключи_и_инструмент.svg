<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="Arial, sans-serif">
<rect width="860" height="600" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Основной инструмент сборщика</text>
<rect x="40" y="92" width="150" height="18" rx="6" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<path d="M 190 82 L 222 72 L 240 86 L 222 92 L 222 110 L 240 116 L 222 130 L 190 120 Z" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
