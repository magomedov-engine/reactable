<g font-size="12" fill="#222" stroke="#333">
<text x="350" y="92" stroke="none">Ободок с шкалой поворачивают,</text><text x="350" y="107" stroke="none">чтобы поставить «0» под стрелку</text>
<line x1="348" y1="98" x2="282" y2="123"/>
<text x="350" y="160" stroke="none" fill="#d33">Большая стрелка: 1 деление = 0,01 мм,</text><text x="350" y="175" stroke="none" fill="#d33">полный оборот = 1 мм</text>
<line x1="348" y1="166" x2="248.3" y2="269.8" stroke="#d33"/>
<text x="350" y="290" stroke="none" fill="#2f6db5">Малая стрелка: считает обороты</text><text x="350" y="305" stroke="none" fill="#2f6db5">большой, то есть целые мм</text>
<line x1="348" y1="292" x2="210" y2="267" stroke="#2f6db5"/>
<text x="214" y="391" stroke="none">Измерительный стержень с наконечником:</text><text x="214" y="406" stroke="none">касается детали, двигается вверх-вниз</text>
</g>
<rect x="350" y="200" width="250" height="62" rx="8" fill="#fff8e1" stroke="#e59a14"/>
<text x="362" y="222" font-size="13" fill="#222">Пример: малая стрелка за «1» → 1 мм,</text>
<text x="362" y="239" font-size="13" fill="#222">большая на «37» → 0,37 мм.</text>
<text x="362" y="256" font-size="14" font-weight="bold" fill="#222">Смещение: 1 + 0,37 = 1,37 мм</text>
<text x="40" y="436" font-size="12" fill="#555">Индикатор показывает не размер, а насколько сместился наконечник</text>
<text x="40" y="452" font-size="12" fill="#555">от того места, где поставили ноль.</text>
<text x="740" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Нутромер в отверстии</text>
<rect x="630" y="150" width="30" height="250" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
<rect x="820" y="150" width="30" height="250" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
<text x="740" y="395" text-anchor="middle" font-size="11" fill="#555">отверстие (гильза)</text>
<rect x="662" y="324" width="156" height="12" fill="#6c7a89" stroke="#222"/>
<line x1="740" y1="324" x2="740" y2="120" stroke="#444" stroke-width="8"/>
