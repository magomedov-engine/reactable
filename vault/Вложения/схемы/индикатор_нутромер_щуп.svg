<path d="M 700 112 A 230 230 0 0 1 780 112" fill="none" stroke="#d33" stroke-width="2" marker-end="url(#m)" marker-start="url(#m)"/>
<text x="790" y="132" font-size="11" fill="#d33">покачать</text>
<text x="620" y="430" font-size="12" fill="#222">1. Поставить ноль по кольцу</text>
<text x="620" y="446" font-size="12" fill="#222">   или микрометру (на номинал).</text>
<text x="620" y="462" font-size="12" fill="#222">2. Ввести в отверстие, покачать.</text>
<text x="620" y="478" font-size="12" fill="#222">3. Читать в момент, когда стрелка</text>
<text x="620" y="494" font-size="12" fill="#222">   «разворачивается» (минимум):</text>
<text x="620" y="510" font-size="12" fill="#222">   это и есть диаметр.</text>
<text x="620" y="526" font-size="12" fill="#222">4. Мерить в 2 направлениях</text>
<text x="620" y="542" font-size="12" fill="#222">   и на 3 высотах (овал, конус).</text>
<line x1="20" y1="470" x2="600" y2="470" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="30" y="496" font-size="15" font-weight="bold" fill="#222">Щуп: набор пластин известной толщины</text>
