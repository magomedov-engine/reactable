<circle cx="85" cy="143.5" r="5" fill="#fff" stroke="#222"/>
<circle cx="85" cy="290" r="6" fill="#333"/>
<circle cx="124" cy="267.5" r="8" fill="#e59a14" stroke="#222" stroke-width="1.5"/>
<line x1="160" y1="120" x2="160" y2="200" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
<text x="85" y="370" text-anchor="middle" font-size="13" fill="#333">Впрыск топлива.</text>
<text x="85" y="386" text-anchor="middle" font-size="13" fill="#333">Оба клапана закрыты.</text>
<text x="85" y="402" text-anchor="middle" font-size="13" fill="#d33">Газы толкают поршень вниз</text>
</g>
<g transform="translate(620 45)">
<text x="85" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#666">4. Выпуск</text>
<text x="58" y="22" text-anchor="middle" font-size="10" fill="#2a8a3a">впуск</text>
<text x="112" y="22" text-anchor="middle" font-size="10" fill="#777">выпуск</text>
<rect x="35" y="76" width="100" height="160" fill="#eceff1"/>
