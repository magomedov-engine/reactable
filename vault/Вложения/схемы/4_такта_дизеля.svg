<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#222"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2a8a3a"/></marker><marker id="s" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#666"/></marker></defs>
<rect width="800" height="520" fill="#ffffff" rx="10"/>
<text x="400" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Четыре такта дизеля (один цилиндр, 720° поворота вала)</text>
<g transform="translate(20 45)">
<text x="85" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a8a3a">1. Впуск</text>
