<line x1="58" y1="40" x2="58" y2="70" stroke="#444" stroke-width="5"/><polygon points="52,70 64,70 73,76 43,76" fill="#444" stroke="#222"/>
<line x1="112" y1="40" x2="112" y2="86" stroke="#888" stroke-width="5"/><polygon points="106,86 118,86 127,92 97,92" fill="#888" stroke="#222"/>
<line x1="102" y1="160" x2="102" y2="106" stroke="#666" stroke-width="3" marker-end="url(#s)"/><line x1="122" y1="160" x2="122" y2="106" stroke="#666" stroke-width="3" marker-end="url(#s)"/>
<circle cx="85" cy="290" r="52" fill="#f8d48a" stroke="#333" stroke-width="2"/>
<line x1="85" y1="185.9" x2="38" y2="307.1" stroke="#222" stroke-width="8" stroke-linecap="round"/>
