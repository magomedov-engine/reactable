<line x1="112" y1="40" x2="112" y2="70" stroke="#444" stroke-width="5"/><polygon points="106,70 118,70 127,76 97,76" fill="#444" stroke="#222"/>
<circle cx="85" cy="290" r="52" fill="#f8d48a" stroke="#333" stroke-width="2"/>
