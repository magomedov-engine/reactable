<line x1="160" y1="200" x2="160" y2="120" stroke="#222" stroke-width="3" marker-end="url(#a)"/>
<text x="85" y="370" text-anchor="middle" font-size="13" fill="#333">Поршень идёт вверх.</text>
<text x="85" y="386" text-anchor="middle" font-size="13" fill="#333">Выпускной клапан открыт.</text>
<text x="85" y="402" text-anchor="middle" font-size="13" fill="#555">Газы уходят наружу</text>
</g>
<text x="400" y="487" text-anchor="middle" font-size="13" fill="#555">Цветной клапан = открыт, тёмный = закрыт (прижат к седлу). Оранжевый кружок внизу: шатунная шейка вала.</text>
<text x="400" y="507" text-anchor="middle" font-size="13" fill="#555">Вал делает 2 оборота = 4 хода поршня = 1 рабочий ход на цилиндр.</text>
</svg>