<circle cx="85" cy="290" r="52" fill="#f8d48a" stroke="#333" stroke-width="2"/>
<line x1="85" y1="175.6" x2="129.3" y2="297.8" stroke="#222" stroke-width="8" stroke-linecap="round"/>
<rect x="37" y="160.6" width="96" height="30" fill="#6c7a89" stroke="#222" stroke-width="2"/>
