<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 590" font-family="Arial, sans-serif">
  <defs>
    <marker id="rot" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
  </defs>
  <rect width="700" height="590" fill="#ffffff" rx="10"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">V12: вид спереди (со стороны вентилятора)</text>

  <g transform="translate(350 400)">
    <!-- левый ряд: головка, блок, гильза, поршень -->
    <g transform="rotate(-37.5)">
      <rect x="-48" y="-330" width="96" height="40" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
      <rect x="-48" y="-290" width="96" height="210" fill="#d9dee3" stroke="#333" stroke-width="2"/>
      <rect x="-34" y="-280" width="68" height="190" fill="#ffffff" stroke="#555" stroke-dasharray="4 3"/>
      <rect x="-34" y="-212" width="68" height="44" fill="#6c7a89" stroke="#222" stroke-width="2"/>
      <line x1="0" y1="-340" x2="0" y2="0" stroke="#d33" stroke-width="1.5" stroke-dasharray="6 4"/>
    </g>
    <!-- правый ряд -->
    <g transform="rotate(37.5)">
      <rect x="-48" y="-330" width="96" height="40" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
      <rect x="-48" y="-290" width="96" height="210" fill="#d9dee3" stroke="#333" stroke-width="2"/>
      <rect x="-34" y="-280" width="68" height="190" fill="#ffffff" stroke="#555" stroke-dasharray="4 3"/>
      <rect x="-34" y="-212" width="68" height="44" fill="#6c7a89" stroke="#222" stroke-width="2"/>
      <line x1="0" y1="-340" x2="0" y2="0" stroke="#d33" stroke-width="1.5" stroke-dasharray="6 4"/>
    </g>

    <!-- коленвал: щека с противовесом, коренная шейка в центре, шатунная шейка смещена -->
    <circle cx="0" cy="0" r="62" fill="#f8d48a" stroke="#333" stroke-width="2"/>
    <path d="M -50 36 A 62 62 0 0 0 50 36 Z" fill="#e8b04a" stroke="#333" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#555" stroke="#222" stroke-width="2"/>

    <!-- оба шатуна идут на ОДНУ шатунную шейку -->
    <line x1="-110" y1="-143.5" x2="0" y2="-42" stroke="#222" stroke-width="11" stroke-linecap="round"/>
    <line x1="110" y1="-143.5" x2="0" y2="-42" stroke="#222" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-110" cy="-143.5" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
    <circle cx="110" cy="-143.5" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
    <circle cx="0" cy="-42" r="15" fill="#e59a14" stroke="#222" stroke-width="2.5"/>

    <!-- стрелка вращения -->
    <path d="M 78 -30 A 84 84 0 0 1 78 32" fill="none" stroke="#555" stroke-width="2" marker-end="url(#rot)"/>

    <!-- поддон -->
    <path d="M -150 85 L 150 85 L 120 145 L -120 145 Z" fill="#f6e27a" stroke="#333" stroke-width="2"/>
    <text x="0" y="121" text-anchor="middle" font-size="14" fill="#333">Масляный поддон (масло)</text>
    <!-- дуга 75° -->
    <path d="M -207 -270 A 340 340 0 0 1 207 -270" fill="none" stroke="#d33" stroke-width="2"/>
  </g>

  <text x="350" y="108" text-anchor="middle" font-size="20" font-weight="bold" fill="#d33">75° (пример)</text>

  <text x="30" y="56" font-size="15" font-weight="bold" fill="#222">Левый ряд (цилиндры 1–6)</text>
  <text x="670" y="56" font-size="15" font-weight="bold" fill="#222" text-anchor="end">Правый ряд (цилиндры 7–12)</text>

  <g font-size="13" fill="#333" stroke="#333">
    <text x="20" y="130" stroke="none">Головка блока</text>
    <line x1="110" y1="134" x2="161" y2="154"/><circle cx="161" cy="154" r="3"/>
    <text x="20" y="230" stroke="none">Цилиндр (гильза)</text>
    <line x1="132" y1="226" x2="171" y2="222"/><circle cx="171" cy="222" r="3"/>
    <text x="20" y="290" stroke="none">Поршень</text>
    <line x1="80" y1="286" x2="226" y2="244"/><circle cx="226" cy="244" r="3"/>
    <text x="20" y="360" stroke="none">Шатун</text>
    <line x1="66" y1="356" x2="292" y2="306"/><circle cx="292" cy="306" r="3"/>
    <text x="20" y="440" stroke="none">Коренная шейка</text>
    <text x="20" y="456" stroke="none">(ось вращения вала)</text>
    <line x1="140" y1="440" x2="336" y2="402"/><circle cx="336" cy="402" r="3"/>
    <text x="680" y="130" text-anchor="end" stroke="none">Блок цилиндров</text>
    <line x1="590" y1="136" x2="510" y2="270"/><circle cx="510" cy="270" r="3"/>
    <text x="680" y="330" text-anchor="end" stroke="none">Шатунная шейка:</text>
    <text x="680" y="346" text-anchor="end" stroke="none">на ней ОБА шатуна</text>
    <line x1="560" y1="338" x2="364" y2="358"/><circle cx="364" cy="358" r="3"/>
    <text x="680" y="440" text-anchor="end" stroke="none">Коленчатый вал</text>
    <text x="680" y="456" text-anchor="end" stroke="none">(щека и противовес)</text>
    <line x1="560" y1="440" x2="400" y2="430"/><circle cx="400" cy="430" r="3"/>
  </g>

  <text x="350" y="205" text-anchor="middle" font-size="13" fill="#555">«Развал»: угол</text>
  <text x="350" y="221" text-anchor="middle" font-size="13" fill="#555">между рядами</text>
  <text x="350" y="568" text-anchor="middle" font-size="13" fill="#555">Красные пунктиры: оси цилиндров. Спереди виден 1 цилиндр из 6 в каждом ряду; остальные стоят за ним.</text>
</svg>
