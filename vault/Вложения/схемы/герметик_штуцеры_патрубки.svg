<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" font-family="Arial, sans-serif">
<defs><pattern id="h" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a96a3" stroke-width="1"/></pattern><pattern id="h2" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a96a3" stroke-width="1"/></pattern></defs>
<rect width="860" height="680" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Герметик, штуцеры и патрубки</text>
<text x="30" y="62" font-size="15" font-weight="bold" fill="#222">1. Валик герметика на фланце (если его требует ТК)</text>
<rect x="50" y="85" width="300" height="170" rx="20" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
<rect x="85" y="120" width="230" height="100" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="200" y="175" font-size="11" fill="#555" text-anchor="middle">полость (внутри мотора)</text>
<circle cx="68" cy="103" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="200" cy="100" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="332" cy="103" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="332" cy="237" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="200" cy="240" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="68" cy="237" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<rect x="76" y="111" width="248" height="118" rx="14" fill="none" stroke="#e65100" stroke-width="4"/>
<path d="M 57 103 A 11 11 0 0 0 79 103" fill="none" stroke="#e65100" stroke-width="4" transform="rotate(0)"/>
<path d="M 189 100 A 11 11 0 0 0 211 100" fill="none" stroke="#e65100" stroke-width="4" transform="rotate(0)"/>
<path d="M 321 103 A 11 11 0 0 0 343 103" fill="none" stroke="#e65100" stroke-width="4" transform="rotate(0)"/>
<path d="M 321 237 A 11 11 0 0 1 343 237" fill="none" stroke="#e65100" stroke-width="4" transform="rotate(0)"/>
<path d="M 189 240 A 11 11 0 0 1 211 240" fill="none" stroke="#e65100" stroke-width="4" transform="rotate(0)"/>
<path d="M 57 237 A 11 11 0 0 1 79 237" fill="none" stroke="#e65100" stroke-width="4" transform="rotate(0)"/>
<text x="370" y="110" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Оранжевый: валик герметика</text>
<text x="370" y="126" font-size="12" fill="#222" text-anchor="start">• сплошной, без разрывов;</text>
<text x="370" y="142" font-size="12" fill="#222" text-anchor="start">• внутри от отверстий болтов</text>
<text x="370" y="158" font-size="12" fill="#222" text-anchor="start">  и вокруг них;</text>
<text x="370" y="174" font-size="12" fill="#222" text-anchor="start">• толщина ~2–3 мм (~пример,</text>
<text x="370" y="190" font-size="12" fill="#222" text-anchor="start">  по инструкции);</text>
<text x="370" y="206" font-size="12" fill="#222" text-anchor="start">• поверхности чистые, сухие,</text>
<text x="370" y="222" font-size="12" fill="#222" text-anchor="start">  обезжиренные;</text>
<text x="370" y="238" font-size="12" fill="#222" text-anchor="start">• собрать и затянуть, пока</text>
<text x="370" y="254" font-size="12" fill="#222" text-anchor="start">  герметик не начал схватываться.</text>
<text x="30" y="300" font-size="13" font-weight="bold" fill="#222">В разрезе после затяжки:</text>
<rect x="50" y="320" width="220" height="30" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="50" y="354" width="220" height="30" fill="url(#h2)" stroke="#333" stroke-width="2"/>
<rect x="50" y="350" width="220" height="4" fill="#e65100"/>
<rect x="320" y="320" width="220" height="30" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="320" y="354" width="220" height="30" fill="url(#h2)" stroke="#333" stroke-width="2"/>
<rect x="320" y="350" width="220" height="4" fill="#e65100"/>
<path d="M 540 348 Q 570 340 566 366 Q 560 392 546 380 Z" fill="#e65100"/>
<circle cx="558" cy="404" r="6" fill="#e65100"/><circle cx="556" cy="424" r="4" fill="#e65100"/>
<text x="160" y="405" font-size="12" fill="#2a8a3a" text-anchor="middle" font-weight="bold">ПРАВИЛЬНО: тонкий слой,</text>
<text x="160" y="421" font-size="12" fill="#2a8a3a" text-anchor="middle">чуть выдавилось по краю</text>
<text x="430" y="405" font-size="12" fill="#d33" text-anchor="middle" font-weight="bold">МНОГО: излишки внутри мотора</text>
<text x="430" y="421" font-size="12" fill="#d33" text-anchor="middle">отрываются и забивают сетку</text>
<text x="430" y="437" font-size="12" fill="#d33" text-anchor="middle">маслоприёмника и каналы</text>
<text x="590" y="330" font-size="12" fill="#555" text-anchor="start">Герметик ставят только</text>
<text x="590" y="346" font-size="12" fill="#555" text-anchor="start">там, где он есть в ТК, и</text>
<text x="590" y="362" font-size="12" fill="#555" text-anchor="start">только указанной марки.</text>
<text x="590" y="378" font-size="12" fill="#555" text-anchor="start">Герметик + прокладка</text>
<text x="590" y="394" font-size="12" fill="#555" text-anchor="start">вместе: только если так</text>
<text x="590" y="410" font-size="12" fill="#555" text-anchor="start">написано.</text>
<line x1="20" y1="465" x2="840" y2="465" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="30" y="490" font-size="15" font-weight="bold" fill="#222">2. Поворотный штуцер</text>
<rect x="40" y="590" width="220" height="40" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="118" y="582" width="64" height="8" fill="#d4874a" stroke="#7a4a00"/>
<rect x="110" y="548" width="80" height="34" rx="6" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="118" y="540" width="64" height="8" fill="#d4874a" stroke="#7a4a00"/>
<rect x="122" y="516" width="56" height="24" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
<rect x="140" y="540" width="20" height="80" fill="#9aa5b1" stroke="#333"/>
<rect x="190" y="556" width="70" height="18" fill="#b7c2cc" stroke="#333"/>
<text x="265" y="570" font-size="11" fill="#555" text-anchor="start">к трубке</text>
<text x="40" y="650" font-size="12" fill="#7a4a00" text-anchor="start" font-weight="bold">Две медные шайбы (оранжевые):</text>
<text x="40" y="666" font-size="12" fill="#7a4a00" text-anchor="start">сверху и снизу, обе НОВЫЕ</text>
<line x1="320" y1="480" x2="320" y2="670" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="340" y="490" font-size="15" font-weight="bold" fill="#222">3. Трубка высокого давления</text>
<path d="M 350 540 L 440 540 L 440 525 L 470 525 L 470 600 L 440 600 L 440 585 L 350 585 Z" fill="url(#h)" stroke="#333" stroke-width="2"/>
<path d="M 470 548 L 500 555 L 500 570 L 470 577 Z" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
<rect x="500" y="557" width="100" height="11" fill="#ffcc80" stroke="#e65100"/>
<rect x="455" y="530" width="55" height="65" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5 3"/>
<text x="482" y="615" font-size="11" fill="#555" text-anchor="middle">гайка</text>
<text x="340" y="640" font-size="12" fill="#222" text-anchor="start">Конус трубки прижат к седлу: металл к металлу.</text>
<text x="340" y="656" font-size="12" fill="#222" text-anchor="start">Без шайб и герметика. Затянуть по моменту ТК:</text>
<text x="340" y="672" font-size="12" fill="#222" text-anchor="start">перетяг сминает конус, потом течёт.</text>
<line x1="620" y1="480" x2="620" y2="670" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="640" y="490" font-size="15" font-weight="bold" fill="#222">4. Патрубок и хомут</text>
<rect x="640" y="540" width="120" height="36" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
<rect x="700" y="536" width="8" height="44" fill="#9aa5b1" stroke="#333"/>
<rect x="680" y="530" width="150" height="56" rx="6" fill="#424242" opacity="0.85"/>
<rect x="725" y="524" width="14" height="68" fill="#bdbdbd" stroke="#333"/>
<text x="732" y="612" font-size="11" fill="#222" text-anchor="middle">хомут за буртиком</text>
<text x="640" y="640" font-size="12" fill="#222" text-anchor="start">Патрубок надет до упора,</text>
<text x="640" y="656" font-size="12" fill="#222" text-anchor="start">хомут за буртиком, не на краю.</text>
<text x="640" y="672" font-size="12" fill="#222" text-anchor="start">Момент хомута по ТК.</text>
</svg>