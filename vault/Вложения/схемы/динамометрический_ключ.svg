<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="Arial, sans-serif">
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d33"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2a8a3a"/></marker></defs>
<rect width="860" height="620" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Щелчковый динамометрический ключ и доворот на угол</text>
<circle cx="70" cy="110" r="24" fill="#9aa5b1" stroke="#333" stroke-width="2"/><rect x="64" y="134" width="12" height="12" fill="#6c7a89" stroke="#333"/>
<rect x="92" y="100" width="420" height="20" fill="#d9dee3" stroke="#333" stroke-width="2"/>
<rect x="300" y="96" width="60" height="28" fill="#fff" stroke="#333"/><text x="330" y="114" text-anchor="middle" font-size="10">шкала</text>
<rect x="512" y="94" width="200" height="32" rx="6" fill="#424242" stroke="#222" stroke-width="2"/>
<rect x="712" y="96" width="24" height="28" rx="4" fill="#e59a14" stroke="#333"/>
<rect x="600" y="94" width="30" height="32" fill="#fdd835" opacity="0.6"/>
<line x1="615" y1="190" x2="615" y2="134" stroke="#2a8a3a" stroke-width="4" marker-end="url(#g)"/>
<g font-size="12" fill="#222">
<text x="30" y="175">квадрат: на него</text><text x="30" y="190">надевают головку</text>
<text x="560" y="210" fill="#2a8a3a">тянуть здесь (метка на ручке),</text><text x="560" y="225" fill="#2a8a3a">под прямым углом к ключу, плавно</text>
<text x="700" y="80">стопор (замок)</text><line x1="740" y1="84" x2="726" y2="96" stroke="#555"/>
<text x="520" y="80">ручка = барабан шкалы</text>
</g>
<line x1="20" y1="250" x2="840" y2="250" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="300" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Как выставить 94 Н·м (пример, шкала увеличена)</text>
<rect x="40" y="300" width="380" height="60" fill="#e3e7eb" stroke="#333" stroke-width="2"/>
<line x1="40" y1="330" x2="440" y2="330" stroke="#222" stroke-width="1.5"/>
<line x1="70" y1="302" x2="70" y2="330" stroke="#222" stroke-width="2"/><text x="70" y="296" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">50</text>
<line x1="150" y1="302" x2="150" y2="330" stroke="#222" stroke-width="2"/><text x="150" y="296" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">60</text>
<line x1="230" y1="302" x2="230" y2="330" stroke="#222" stroke-width="2"/><text x="230" y="296" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">70</text>
<line x1="310" y1="302" x2="310" y2="330" stroke="#222" stroke-width="2"/><text x="310" y="296" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">80</text>
<line x1="390" y1="302" x2="390" y2="330" stroke="#2f6db5" stroke-width="3"/><text x="390" y="296" text-anchor="middle" font-size="13" fill="#2f6db5" font-weight="bold">90</text>
<text x="200" y="352" text-anchor="middle" font-size="11" fill="#555">шкала на трубе: через 10 Н·м</text>
<rect x="425" y="290" width="150" height="80" fill="#5f5f5f" stroke="#222" stroke-width="2"/>
<line x1="425" y1="366" x2="441" y2="366" stroke="#fff" stroke-width="1.5"/>
<text x="447" y="370" font-size="11" fill="#fff">0</text>
<line x1="425" y1="357" x2="434" y2="357" stroke="#fff" stroke-width="1.5"/>
<line x1="425" y1="348" x2="434" y2="348" stroke="#fff" stroke-width="1.5"/>
<text x="447" y="352" font-size="11" fill="#fff">2</text>
<line x1="425" y1="339" x2="434" y2="339" stroke="#fff" stroke-width="1.5"/>
<line x1="425" y1="330" x2="434" y2="330" stroke="#fff" stroke-width="1.5"/>
<text x="447" y="334" font-size="11" fill="#fff">4</text>
<line x1="425" y1="321" x2="441" y2="321" stroke="#fff" stroke-width="1.5"/>
<line x1="425" y1="312" x2="434" y2="312" stroke="#fff" stroke-width="1.5"/>
<text x="447" y="316" font-size="11" fill="#fff">6</text>
<line x1="425" y1="303" x2="434" y2="303" stroke="#fff" stroke-width="1.5"/>
<line x1="425" y1="294" x2="434" y2="294" stroke="#fff" stroke-width="1.5"/>
<text x="447" y="298" font-size="11" fill="#fff">8</text>
<line x1="425" y1="330" x2="470" y2="330" stroke="#ffeb3b" stroke-width="3"/>
<text x="480" y="335" font-size="14" font-weight="bold" fill="#ffeb3b">4</text>
<text x="425" y="388" font-size="11" fill="#555">ручка-барабан: через 1 Н·м</text>
<text x="600" y="300" font-size="12" fill="#222">1. Открыть стопор на конце ручки.</text>
<text x="600" y="318" font-size="12" fill="#222">2. Вращать ручку: её край дошёл до 90.</text>
<text x="600" y="336" font-size="12" fill="#222">3. Довернуть ручку: на линии цифра 4.</text>
<text x="600" y="354" font-size="12" fill="#222">   90 + 4 = 94 Н·м.</text>
<text x="600" y="372" font-size="12" fill="#222">4. Закрыть стопор. Проверить ещё раз.</text>
<text x="600" y="390" font-size="12" fill="#555">После работы: ручку вниз до минимума</text>
<text x="600" y="408" font-size="12" fill="#555">(не до нуля!), ключ в футляр.</text>
<line x1="20" y1="430" x2="840" y2="430" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="430" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Доворот на угол 90°: метод меток маркером (пример)</text>
<polygon points="190.0,530.0 170.0,564.6 130.0,564.6 110.0,530.0 130.0,495.4 170.0,495.4" fill="#d9dee3" stroke="#333" stroke-width="2"/>
<line x1="150" y1="530" x2="150.0" y2="492.0" stroke="#d33" stroke-width="4"/>
<line x1="150" y1="480" x2="150" y2="488" stroke="#2f6db5" stroke-width="4"/>
<text x="150" y="590" text-anchor="middle" font-size="12" fill="#222">1. После затяжки моментом:</text>
<polygon points="440.0,530.0 420.0,564.6 380.0,564.6 360.0,530.0 380.0,495.4 420.0,495.4" fill="#d9dee3" stroke="#333" stroke-width="2"/>
<line x1="400" y1="530" x2="438.0" y2="530.0" stroke="#d33" stroke-width="4"/>
<line x1="400" y1="480" x2="400" y2="488" stroke="#2f6db5" stroke-width="4"/>
<text x="400" y="590" text-anchor="middle" font-size="12" fill="#222">2. Довернули на 90°:</text>
<text x="150" y="606" text-anchor="middle" font-size="11" fill="#555">красная метка на болте против синей на детали</text>
<text x="400" y="606" text-anchor="middle" font-size="11" fill="#555">метка ушла на четверть оборота</text>
<path d="M 290 530 L 330 530" stroke="#d33" stroke-width="3" marker-end="url(#m)"/>
<text x="540" y="490" font-size="12" fill="#222">Угол доворачивают одним плавным</text>
<text x="540" y="508" font-size="12" fill="#222">движением. Если остановились на</text>
<text x="540" y="526" font-size="12" fill="#222">середине, сообщите мастеру: не</text>
<text x="540" y="544" font-size="12" fill="#222">«дотягивайте» по своему усмотрению.</text>
<text x="540" y="562" font-size="12" fill="#222">Для угла бывает угломер (шкала</text>
<text x="540" y="580" font-size="12" fill="#222">в градусах между ключом и головкой).</text>
</svg>