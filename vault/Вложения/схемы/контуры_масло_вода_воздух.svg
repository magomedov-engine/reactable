<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="Arial, sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#444"/></marker>
  </defs>
  <rect width="920" height="440" fill="#ffffff" rx="10"/>
  <text x="460" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Три «контура» двигателя: масло, вода, воздух</text>

  <!-- МАСЛО -->
  <text x="24" y="54" font-size="14" font-weight="bold" fill="#a97c00">1. Смазка (масло)</text>
  <g font-size="12" fill="#222" text-anchor="middle">
    <rect x="24" y="64" width="112" height="46" rx="6" fill="#fff3c4" stroke="#e0a800" stroke-width="2"/><text x="80" y="84">Масляный</text><text x="80" y="100">поддон</text>
    <rect x="150" y="64" width="112" height="46" rx="6" fill="#fff3c4" stroke="#e0a800" stroke-width="2"/><text x="206" y="84">Масляный</text><text x="206" y="100">насос</text>
    <rect x="276" y="64" width="112" height="46" rx="6" fill="#fff3c4" stroke="#e0a800" stroke-width="2"/><text x="332" y="84">Масляный</text><text x="332" y="100">фильтр</text>
    <rect x="402" y="64" width="112" height="46" rx="6" fill="#fff3c4" stroke="#e0a800" stroke-width="2"/><text x="458" y="84">Радиатор</text><text x="458" y="100">масла</text>
    <rect x="528" y="64" width="112" height="46" rx="6" fill="#fff3c4" stroke="#e0a800" stroke-width="2"/><text x="584" y="84">Магистраль</text><text x="584" y="100">в блоке</text>
    <rect x="654" y="64" width="150" height="46" rx="6" fill="#fff3c4" stroke="#e0a800" stroke-width="2"/><text x="729" y="84">Подшипники, ГРМ,</text><text x="729" y="100">поршни, турбина</text>
  </g>
  <g stroke="#444" stroke-width="2" marker-end="url(#m)">
    <line x1="137" y1="87" x2="148" y2="87"/><line x1="263" y1="87" x2="274" y2="87"/><line x1="389" y1="87" x2="400" y2="87"/><line x1="515" y1="87" x2="526" y2="87"/><line x1="641" y1="87" x2="652" y2="87"/>
  </g>
  <path d="M 729 112 L 729 128 L 80 128 L 80 112" fill="none" stroke="#a97c00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m)"/>
  <text x="404" y="123" text-anchor="middle" font-size="12" fill="#a97c00">стекает обратно в поддон</text>

  <!-- ВОДА -->
  <text x="24" y="168" font-size="14" font-weight="bold" fill="#1f6fb0">2. Охлаждение (жидкость)</text>
  <g font-size="12" fill="#222" text-anchor="middle">
    <rect x="24" y="178" width="112" height="46" rx="6" fill="#d6ecfb" stroke="#3d8fd1" stroke-width="2"/><text x="80" y="198">Водяной</text><text x="80" y="214">насос</text>
    <rect x="150" y="178" width="112" height="46" rx="6" fill="#d6ecfb" stroke="#3d8fd1" stroke-width="2"/><text x="206" y="198">Рубашка</text><text x="206" y="214">блока</text>
    <rect x="276" y="178" width="112" height="46" rx="6" fill="#d6ecfb" stroke="#3d8fd1" stroke-width="2"/><text x="332" y="198">Головки</text><text x="332" y="214">блока</text>
    <rect x="402" y="178" width="112" height="46" rx="6" fill="#d6ecfb" stroke="#3d8fd1" stroke-width="2"/><text x="458" y="206">Термостат</text>
    <rect x="528" y="178" width="112" height="46" rx="6" fill="#d6ecfb" stroke="#3d8fd1" stroke-width="2"/><text x="584" y="198">Радиатор</text><text x="584" y="214">(охлаждение)</text>
  </g>
  <g stroke="#444" stroke-width="2" marker-end="url(#m)">
    <line x1="137" y1="201" x2="148" y2="201"/><line x1="263" y1="201" x2="274" y2="201"/><line x1="389" y1="201" x2="400" y2="201"/><line x1="515" y1="201" x2="526" y2="201"/>
  </g>
  <path d="M 584 226 L 584 242 L 80 242 L 80 226" fill="none" stroke="#1f6fb0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m)"/>
  <text x="332" y="237" text-anchor="middle" font-size="12" fill="#1f6fb0">возврат к насосу</text>
  <text x="24" y="262" font-size="12" fill="#555">Пока мотор холодный, термостат закрыт: жидкость идёт мимо радиатора (малый круг), чтобы быстрее прогреться.</text>

  <!-- ВОЗДУХ -->
  <text x="24" y="292" font-size="14" font-weight="bold" fill="#2e7d32">3. Воздух и выхлоп</text>
  <g font-size="12" fill="#222" text-anchor="middle">
    <rect x="24" y="302" width="112" height="46" rx="6" fill="#dff3df" stroke="#3e9a3e" stroke-width="2"/><text x="80" y="322">Воздушный</text><text x="80" y="338">фильтр</text>
    <rect x="150" y="302" width="112" height="46" rx="6" fill="#dff3df" stroke="#3e9a3e" stroke-width="2"/><text x="206" y="322">Компрессор</text><text x="206" y="338">турбины</text>
    <rect x="276" y="302" width="112" height="46" rx="6" fill="#dff3df" stroke="#3e9a3e" stroke-width="2"/><text x="332" y="322">Охладитель</text><text x="332" y="338">наддува</text>
    <rect x="402" y="302" width="112" height="46" rx="6" fill="#dff3df" stroke="#3e9a3e" stroke-width="2"/><text x="458" y="322">Впускной</text><text x="458" y="338">коллектор</text>
    <rect x="528" y="302" width="112" height="46" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/><text x="584" y="330">Цилиндры</text>
    <rect x="654" y="302" width="112" height="46" rx="6" fill="#fde0dc" stroke="#d33" stroke-width="2"/><text x="710" y="322">Выпускной</text><text x="710" y="338">коллектор</text>
    <rect x="780" y="302" width="112" height="46" rx="6" fill="#fde0dc" stroke="#d33" stroke-width="2"/><text x="836" y="322">Турбина</text><text x="836" y="338">→ выхлоп</text>
  </g>
  <g stroke="#444" stroke-width="2" marker-end="url(#m)">
    <line x1="137" y1="325" x2="148" y2="325"/><line x1="263" y1="325" x2="274" y2="325"/><line x1="389" y1="325" x2="400" y2="325"/><line x1="515" y1="325" x2="526" y2="325"/><line x1="641" y1="325" x2="652" y2="325"/><line x1="767" y1="325" x2="778" y2="325"/>
  </g>
  <text x="24" y="378" font-size="12" fill="#555">Турбина вращается выхлопными газами и одним валом раскручивает компрессор: тот нагнетает больше воздуха в цилиндры.</text>
  <text x="24" y="398" font-size="12" fill="#555">Зелёное: чистый воздух, красное: горячие отработавшие газы. Охладитель делает воздух плотнее, значит, в цилиндр его помещается больше.</text>
</svg>
