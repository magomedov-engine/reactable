<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, sans-serif">
  <rect width="900" height="650" fill="#ffffff" rx="10"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">V12-дизель: общий вид сбоку (правый ряд, упрощённо)</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#555">Цвета: серый = детали, жёлтый = масло, синий = вода, зелёный = воздух, красный = выхлоп, оранжевый = топливо</text>

  <!-- поддон -->
  <path d="M 200 390 L 680 390 L 660 450 L 220 450 Z" fill="#f6e27a" stroke="#333" stroke-width="2"/>
  <!-- блок-картер -->
  <rect x="160" y="250" width="560" height="140" fill="#cfd6dc" stroke="#333" stroke-width="2"/>
  <!-- коленвал внутри -->
  <line x1="130" y1="350" x2="770" y2="350" stroke="#d33" stroke-width="2" stroke-dasharray="10 5"/>
  <!-- цилиндры внутри (пунктир) -->
  <g stroke="#7d8a96" stroke-dasharray="4 3" fill="none">
    <rect x="205" y="255" width="60" height="85"/><rect x="285" y="255" width="60" height="85"/><rect x="365" y="255" width="60" height="85"/><rect x="445" y="255" width="60" height="85"/><rect x="525" y="255" width="60" height="85"/><rect x="605" y="255" width="60" height="85"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle"><text x="235" y="300">7</text><text x="315" y="300">8</text><text x="395" y="300">9</text><text x="475" y="300">10</text><text x="555" y="300">11</text><text x="635" y="300">12</text></g>
  <!-- головки (по одной на цилиндр) и клапанные крышки -->
  <g fill="#9aa5b1" stroke="#333" stroke-width="2">
    <rect x="195" y="205" width="78" height="45"/><rect x="277" y="205" width="78" height="45"/><rect x="359" y="205" width="78" height="45"/><rect x="441" y="205" width="78" height="45"/><rect x="523" y="205" width="78" height="45"/><rect x="605" y="205" width="78" height="45"/>
  </g>
  <g fill="#6c7a89" stroke="#333" stroke-width="1.5">
    <rect x="202" y="188" width="64" height="17" rx="4"/><rect x="284" y="188" width="64" height="17" rx="4"/><rect x="366" y="188" width="64" height="17" rx="4"/><rect x="448" y="188" width="64" height="17" rx="4"/><rect x="530" y="188" width="64" height="17" rx="4"/><rect x="612" y="188" width="64" height="17" rx="4"/>
  </g>
  <!-- выпускной коллектор -->
  <g stroke="#c62828" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M 234 240 L 234 268"/><path d="M 316 240 L 316 268"/><path d="M 398 240 L 398 268"/><path d="M 480 240 L 480 268"/><path d="M 562 240 L 562 268"/><path d="M 644 240 L 644 268"/>
  </g>
  <rect x="222" y="262" width="470" height="16" rx="8" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <path d="M 692 270 L 708 270 L 708 175" fill="none" stroke="#c62828" stroke-width="10"/>
  <!-- турбокомпрессор -->
  <circle cx="712" cy="150" r="27" fill="#ef9a9a" stroke="#c62828" stroke-width="3"/>
  <circle cx="764" cy="150" r="24" fill="#c8e6c9" stroke="#2a8a3a" stroke-width="3"/>
  <rect x="728" y="143" width="22" height="14" fill="#9aa5b1" stroke="#333"/>
  <path d="M 712 123 L 712 90" stroke="#c62828" stroke-width="10" fill="none"/>
  <text x="722" y="88" font-size="11" fill="#c62828">выхлоп наружу</text>
  <!-- воздух: фильтр → компрессор → охладитель -->
  <rect x="800" y="185" width="70" height="60" rx="8" fill="#e8f5e9" stroke="#2a8a3a" stroke-width="2"/>
  <path d="M 782 165 L 812 188" stroke="#2a8a3a" stroke-width="8"/>
  <path d="M 764 126 L 764 100 L 590 100 L 590 112" fill="none" stroke="#2a8a3a" stroke-width="8"/>
  <rect x="400" y="110" width="200" height="45" rx="6" fill="#c8e6c9" stroke="#2a8a3a" stroke-width="2"/>
  <g stroke="#2a8a3a"><line x1="420" y1="115" x2="420" y2="150"/><line x1="440" y1="115" x2="440" y2="150"/><line x1="460" y1="115" x2="460" y2="150"/><line x1="480" y1="115" x2="480" y2="150"/><line x1="500" y1="115" x2="500" y2="150"/><line x1="520" y1="115" x2="520" y2="150"/><line x1="540" y1="115" x2="540" y2="150"/><line x1="560" y1="115" x2="560" y2="150"/><line x1="580" y1="115" x2="580" y2="150"/></g>
  <path d="M 410 155 L 410 182" stroke="#2a8a3a" stroke-width="8" fill="none"/>
  <rect x="285" y="176" width="320" height="10" fill="#a5d6a7" stroke="#2a8a3a" stroke-dasharray="5 3"/>
  <!-- ТНВД и форсунки -->
  <rect x="175" y="150" width="90" height="32" rx="4" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <!-- передняя крышка шестерён, шкивы, насос -->
  <rect x="140" y="200" width="20" height="190" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
  <circle cx="115" cy="350" r="32" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
  <circle cx="115" cy="350" r="8" fill="#444"/>
  <circle cx="118" cy="255" r="22" fill="#bbdefb" stroke="#2f6db5" stroke-width="2"/>
  <circle cx="80" cy="205" r="24" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
  <path d="M 85 350 L 58 210 M 145 350 L 138 262 M 102 186 L 110 236" stroke="#333" stroke-width="2" fill="none"/>
  <!-- масляный фильтр, топливный фильтр -->
  <rect x="300" y="315" width="34" height="62" rx="6" fill="#f6e27a" stroke="#a08300" stroke-width="2"/>
  <rect x="450" y="315" width="28" height="55" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <!-- картер маховика, маховик, стартер -->
  <path d="M 720 220 L 770 210 L 790 300 L 790 410 L 720 420 Z" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
  <circle cx="755" cy="350" r="52" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="690" y="425" width="80" height="30" rx="6" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
  <!-- радиатор впереди (контур) -->
  <rect x="10" y="130" width="20" height="260" fill="#e3f0fb" stroke="#2f6db5" stroke-width="2" stroke-dasharray="6 3"/>

  <text x="40" y="482" font-size="14" font-weight="bold" fill="#222">◀ ПЕРЕД (вентилятор, шкивы)</text>
  <text x="860" y="482" text-anchor="end" font-size="14" font-weight="bold" fill="#222">ЗАД (маховик, к генератору/коробке) ▶</text>

  <!-- номера деталей -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="234" cy="196" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="234" y="200" fill="#fff">1</text>
    <circle cx="316" cy="232" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="316" y="236" fill="#fff">2</text>
    <circle cx="220" cy="166" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="220" y="170" fill="#fff">3</text>
    <circle cx="500" cy="132" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="500" y="136" fill="#fff">4</text>
    <circle cx="712" cy="150" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="712" y="154" fill="#fff">5</text>
    <circle cx="835" cy="215" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="835" y="219" fill="#fff">6</text>
    <circle cx="450" cy="270" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="450" y="274" fill="#fff">7</text>
    <circle cx="317" cy="346" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="317" y="350" fill="#fff">8</text>
    <circle cx="464" cy="342" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="464" y="346" fill="#fff">9</text>
    <circle cx="440" cy="420" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="440" y="424" fill="#fff">10</text>
    <circle cx="600" cy="372" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="600" y="376" fill="#fff">11</text>
    <circle cx="730" cy="440" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="730" y="444" fill="#fff">12</text>
    <circle cx="755" cy="395" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="755" y="399" fill="#fff">13</text>
    <circle cx="98" cy="330" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="98" y="334" fill="#fff">14</text>
    <circle cx="118" cy="255" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="118" y="259" fill="#fff">15</text>
    <circle cx="19" cy="260" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="19" y="264" fill="#fff">16</text>
    <circle cx="80" cy="205" r="11" fill="#222" stroke="#fff" stroke-width="2"/><text x="80" y="209" fill="#fff">17</text>
  </g>
  <text x="165" y="343" font-size="11" fill="#d33">коленвал внутри</text>
  <line x1="20" y1="498" x2="880" y2="498" stroke="#ccc" stroke-dasharray="6 4"/>
  <g font-size="12" fill="#222">
    <text x="25" y="520">1 · Клапанная крышка (под ней коромысла)</text>
    <text x="25" y="537">2 · Головка блока (тут своя на цилиндр)</text>
    <text x="25" y="554">3 · ТНВД (топливный насос)</text>
    <text x="25" y="571">4 · Охладитель наддувочного воздуха</text>
    <text x="25" y="588">5 · Турбокомпрессор</text>
    <text x="25" y="605">6 · Воздушный фильтр</text>
    <text x="330" y="520">7 · Выпускной коллектор</text>
    <text x="330" y="537">8 · Масляный фильтр</text>
    <text x="330" y="554">9 · Топливный фильтр</text>
    <text x="330" y="571">10 · Масляный поддон</text>
    <text x="330" y="588">11 · Блок цилиндров (картер)</text>
    <text x="330" y="605">12 · Стартер</text>
    <text x="610" y="520">13 · Маховик (в картере маховика)</text>
    <text x="610" y="537">14 · Шкив коленвала / гаситель</text>
    <text x="610" y="554">15 · Водяной насос</text>
    <text x="610" y="571">16 · Радиатор (часто стоит отдельно)</text>
    <text x="610" y="588">17 · Генератор</text>
  </g>
  <text x="450" y="638" text-anchor="middle" font-size="12" fill="#555">Цифры 7–12 на блоке: цилиндры правого ряда. Левый ряд (1–6) с другой стороны, такой же. Расположение узлов у вашего мотора может отличаться.</text>
</svg>
