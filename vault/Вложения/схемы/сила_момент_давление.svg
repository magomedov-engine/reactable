<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" font-family="Arial, sans-serif">
<defs><marker id="r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d33"/></marker><marker id="e" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#2f6db5"/></marker></defs>
<rect width="860" height="680" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Сила, момент и давление: что за чем стоит</text>
<text x="30" y="62" font-size="15" font-weight="bold" fill="#222">1. Масса и сила</text>
<line x1="120" y1="80" x2="120" y2="110" stroke="#555" stroke-width="2"/>
<path d="M 95 150 L 145 150 L 135 110 L 105 110 Z" fill="#6c7a89" stroke="#333" stroke-width="2"/>
<text x="120" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1 кг</text>
<line x1="120" y1="155" x2="120" y2="205" stroke="#d33" stroke-width="4" marker-end="url(#r)"/>
<text x="135" y="190" font-size="12" fill="#d33" text-anchor="start">тянет вниз с силой</text>
<text x="135" y="206" font-size="13" fill="#d33" text-anchor="start" font-weight="bold">≈ 9,81 Н ≈ 10 Н</text>
<text x="30" y="240" font-size="12" fill="#222" text-anchor="start">Килограмм (кг) = масса: сколько «вещества».</text>
<text x="30" y="256" font-size="12" fill="#222" text-anchor="start">Ньютон (Н) = сила: как сильно давят или тянут.</text>
<text x="30" y="272" font-size="12" fill="#222" text-anchor="start">Старая единица силы: 1 кгс ≈ 9,81 Н.</text>
<text x="30" y="288" font-size="12" fill="#222" text-anchor="start">Для прикидки в уме: 1 кгс ≈ 10 Н, 100 кгс ≈ 1 кН.</text>
<line x1="430" y1="50" x2="430" y2="315" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="450" y="62" font-size="15" font-weight="bold" fill="#222">2. Момент = сила × плечо</text>
<polygon points="480,120 500,108 520,120 520,140 500,152 480,140" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="500" cy="130" r="16" fill="none" stroke="#6c7a89" stroke-width="7"/>
<rect x="514" y="124" width="250" height="12" rx="5" fill="#6c7a89" stroke="#333"/>
<line x1="740" y1="90" x2="740" y2="120" stroke="#d33" stroke-width="4" marker-end="url(#r)"/>
<text x="748" y="100" font-size="12" fill="#d33" text-anchor="start" font-weight="bold">200 Н</text>
<text x="748" y="116" font-size="12" fill="#d33" text-anchor="start">(≈ 20 кгс)</text>
<line x1="500" y1="160" x2="740" y2="160" stroke="#2f6db5" stroke-width="1.5" marker-start="url(#e)" marker-end="url(#e)"/>
<text x="620" y="178" font-size="12" fill="#2f6db5" text-anchor="middle">плечо 0,5 м</text>
<rect x="450" y="195" width="390" height="34" rx="6" fill="#fff8e1" stroke="#e59a14"/>
<text x="645" y="217" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">200 Н × 0,5 м = 100 Н·м (≈ 10,2 кгс·м)</text>
<text x="450" y="250" font-size="12" fill="#222" text-anchor="start">Тот же момент даёт 100 Н на плече 1 м.</text>
<text x="450" y="266" font-size="12" fill="#222" text-anchor="start">Поэтому удлинять ключ трубой нельзя: момент растёт,</text>
<text x="450" y="282" font-size="12" fill="#222" text-anchor="start">а вы этого не видите. Пересчёт старых единиц:</text>
<text x="450" y="298" font-size="12" fill="#222" text-anchor="start">Н·м = кгс·м × 9,81;  Н·м = фунт-фут (lbf·ft) × 1,356.</text>
<line x1="20" y1="325" x2="840" y2="325" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="30" y="352" font-size="15" font-weight="bold" fill="#222">3. Давление = сила, делённая на площадь</text>
<circle cx="150" cy="480" r="103" fill="#b7c2cc" stroke="#333" stroke-width="3"/><circle cx="150" cy="480" r="95" fill="#fff" stroke="#333"/>
<line x1="82.8" y1="547.2" x2="92.7" y2="537.3" stroke="#222" stroke-width="2"/>
<text x="101.2" y="532.8" text-anchor="middle" font-size="11" fill="#222">0,0</text>
<text x="115.4" y="518.6" text-anchor="middle" font-size="10" fill="#2f6db5">0</text>
<line x1="59.6" y1="509.4" x2="67.3" y2="506.9" stroke="#222" stroke-width="2"/>
<text x="84.4" y="505.3" text-anchor="middle" font-size="11" fill="#222">0,1</text>
<text x="103.4" y="499.1" text-anchor="middle" font-size="10" fill="#2f6db5">1</text>
<line x1="56.2" y1="465.1" x2="64.1" y2="466.4" stroke="#222" stroke-width="2"/>
<text x="81.8" y="473.2" text-anchor="middle" font-size="11" fill="#222">0,2</text>
<text x="101.6" y="476.3" text-anchor="middle" font-size="10" fill="#2f6db5">2</text>
<line x1="73.1" y1="424.2" x2="79.6" y2="428.9" stroke="#222" stroke-width="2"/>
<text x="94.2" y="443.4" text-anchor="middle" font-size="11" fill="#222">0,3</text>
<text x="110.4" y="455.2" text-anchor="middle" font-size="10" fill="#2f6db5">3</text>
<line x1="106.9" y1="395.4" x2="110.5" y2="402.5" stroke="#222" stroke-width="2"/>
<text x="118.7" y="422.5" text-anchor="middle" font-size="11" fill="#222">0,4</text>
<text x="127.8" y="440.3" text-anchor="middle" font-size="10" fill="#2f6db5">4</text>
<line x1="150.0" y1="385.0" x2="150.0" y2="399.0" stroke="#222" stroke-width="2"/>
<text x="150.0" y="415.0" text-anchor="middle" font-size="11" fill="#222">0,5</text>
<text x="150.0" y="435.0" text-anchor="middle" font-size="10" fill="#2f6db5">5</text>
<line x1="193.1" y1="395.4" x2="189.5" y2="402.5" stroke="#222" stroke-width="2"/>
<text x="181.3" y="422.5" text-anchor="middle" font-size="11" fill="#222">0,6</text>
<text x="172.2" y="440.3" text-anchor="middle" font-size="10" fill="#2f6db5">6</text>
<line x1="226.9" y1="424.2" x2="220.4" y2="428.9" stroke="#222" stroke-width="2"/>
<text x="205.8" y="443.4" text-anchor="middle" font-size="11" fill="#222">0,7</text>
<text x="189.6" y="455.2" text-anchor="middle" font-size="10" fill="#2f6db5">7</text>
<line x1="243.8" y1="465.1" x2="235.9" y2="466.4" stroke="#222" stroke-width="2"/>
<text x="218.2" y="473.2" text-anchor="middle" font-size="11" fill="#222">0,8</text>
<text x="198.4" y="476.3" text-anchor="middle" font-size="10" fill="#2f6db5">8</text>
<line x1="240.4" y1="509.4" x2="232.7" y2="506.9" stroke="#222" stroke-width="2"/>
<text x="215.6" y="505.3" text-anchor="middle" font-size="11" fill="#222">0,9</text>
<text x="196.6" y="499.1" text-anchor="middle" font-size="10" fill="#2f6db5">9</text>
<line x1="217.2" y1="547.2" x2="207.3" y2="537.3" stroke="#222" stroke-width="2"/>
<text x="198.8" y="532.8" text-anchor="middle" font-size="11" fill="#222">1,0</text>
<text x="184.6" y="518.6" text-anchor="middle" font-size="10" fill="#2f6db5">10</text>
<line x1="150" y1="480" x2="111.4" y2="404.3" stroke="#d33" stroke-width="3"/><circle cx="150" cy="480" r="6" fill="#d33"/>
<text x="150" y="520" text-anchor="middle" font-size="12" fill="#222">МПа</text><text x="150" y="536" text-anchor="middle" font-size="12" fill="#2f6db5">бар (кгс/см²)</text>
<text x="150" y="610" font-size="13" fill="#d33" text-anchor="middle" font-weight="bold">Стрелка: 0,4 МПа = 4 бар</text>
<text x="150" y="628" font-size="11" fill="#555" text-anchor="middle">(чёрная шкала: МПа, синяя: бар)</text>
<rect x="290" y="370" width="270" height="170" rx="8" fill="#e3f0fb" stroke="#2f6db5"/>
<text x="305" y="392" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Запомнить:</text>
<text x="305" y="408" font-size="13" fill="#222" text-anchor="start">1 МПа = 10 бар</text>
<text x="305" y="424" font-size="13" fill="#222" text-anchor="start">1 бар ≈ 1 кгс/см² ≈ 1 атм</text>
<text x="305" y="440" font-size="13" fill="#222" text-anchor="start">1 бар = 100 кПа = 0,1 МПа</text>
<text x="305" y="456" font-size="13" fill="#222" text-anchor="start">1 бар ≈ 14,5 psi</text>
<text x="305" y="472" font-size="13" fill="#222" text-anchor="start"></text>
<text x="305" y="488" font-size="13" fill="#222" text-anchor="start">Делите бары на 10, получите МПа.</text>
<rect x="580" y="370" width="260" height="210" rx="8" fill="#fafbfc" stroke="#999"/>
<text x="592" y="392" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Для чувства масштаба (~пример):</text>
<text x="592" y="408" font-size="12" fill="#222" text-anchor="start">шина легковушки: ~2–2,5 бар</text>
<text x="592" y="424" font-size="12" fill="#222" text-anchor="start">масло в двигателе: ~3–6 бар</text>
<text x="592" y="440" font-size="12" fill="#222" text-anchor="start">   (0,3–0,6 МПа)</text>
<text x="592" y="456" font-size="12" fill="#222" text-anchor="start">наддув: ~1,5–2,5 бар</text>
<text x="592" y="472" font-size="12" fill="#222" text-anchor="start">впрыск механической</text>
<text x="592" y="488" font-size="12" fill="#222" text-anchor="start">   форсунки: сотни бар</text>
<text x="592" y="504" font-size="12" fill="#222" text-anchor="start">Common Rail: до ~2000 бар</text>
<text x="592" y="520" font-size="12" fill="#222" text-anchor="start">   (около 200 МПа)</text>
<text x="290" y="565" font-size="12" fill="#555" text-anchor="start">Манометр обычно показывает давление</text>
<text x="290" y="581" font-size="12" fill="#555" text-anchor="start">сверх атмосферного: на выключенном</text>
<text x="290" y="597" font-size="12" fill="#555" text-anchor="start">двигателе стрелка стоит на нуле.</text>
<text x="430" y="665" text-anchor="middle" font-size="12" fill="#d33">Перед записью числа всегда смотрите, в чём шкала прибора и в чём число в ТК: 4 бар и 4 МПа отличаются в 10 раз.</text>
</svg>