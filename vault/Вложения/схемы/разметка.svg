<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d33"/></marker>
  </defs>
  <rect width="860" height="600" fill="#ffffff" rx="10"/>
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Разметка: инструмент и порядок работы</text>

  <!-- ===== Инструмент ===== -->
  <!-- чертилка -->
  <line x1="40" y1="90" x2="190" y2="90" stroke="#6c7a89" stroke-width="6" stroke-linecap="round"/>
  <path d="M 190 87 L 210 90 L 190 93 Z" fill="#333"/>
  <text x="40" y="70" font-size="13" font-weight="bold" fill="#222">Чертилка</text>
  <text x="40" y="115" font-size="11" fill="#555">острой иглой проводят риску</text>
  <!-- кернер -->
  <rect x="270" y="80" width="110" height="18" rx="3" fill="#9aa5b1" stroke="#333" stroke-width="1.5"/>
  <g stroke="#555"><line x1="290" y1="80" x2="290" y2="98"/><line x1="300" y1="80" x2="300" y2="98"/><line x1="310" y1="80" x2="310" y2="98"/><line x1="320" y1="80" x2="320" y2="98"/></g>
  <path d="M 380 80 L 405 86 L 412 89 L 405 92 L 380 98 Z" fill="#6c7a89" stroke="#333"/>
  <text x="270" y="70" font-size="13" font-weight="bold" fill="#222">Кернер</text>
  <text x="270" y="115" font-size="11" fill="#555">остриём (угол ~60°) ставят ямку-керн;</text>
  <text x="270" y="129" font-size="11" fill="#555">бьют по нему молотком ~200 г</text>
  <!-- угольник -->
  <path d="M 500 60 L 512 60 L 512 128 L 590 128 L 590 140 L 500 140 Z" fill="#b7c2cc" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="70" font-size="13" font-weight="bold" fill="#222">Угольник 90°</text>
  <text x="530" y="88" font-size="11" fill="#555">риски под прямым</text>
  <text x="530" y="102" font-size="11" fill="#555">углом к краю</text>
  <!-- циркуль -->
  <line x1="720" y1="60" x2="695" y2="140" stroke="#6c7a89" stroke-width="5" stroke-linecap="round"/>
  <line x1="720" y1="60" x2="750" y2="140" stroke="#6c7a89" stroke-width="5" stroke-linecap="round"/>
  <circle cx="720" cy="60" r="6" fill="#444"/>
  <path d="M 705 120 Q 722 105 742 118" fill="none" stroke="#333" stroke-width="2"/>
  <text x="680" y="165" font-size="13" font-weight="bold" fill="#222">Разметочный циркуль</text>
  <text x="680" y="181" font-size="11" fill="#555">окружности и равные отрезки</text>

  <!-- штангенрейсмас на плите -->
  <rect x="40" y="290" width="330" height="22" fill="#9aa5b1" stroke="#333" stroke-width="1.5"/>
  <text x="205" y="306" text-anchor="middle" font-size="11" fill="#222">разметочная плита (ровная база)</text>
  <rect x="60" y="270" width="60" height="20" fill="#6c7a89" stroke="#333"/>
  <rect x="84" y="160" width="12" height="110" fill="#b7c2cc" stroke="#333"/>
  <rect x="76" y="215" width="40" height="22" fill="#6c7a89" stroke="#333"/>
  <path d="M 116 224 L 170 226 L 116 230 Z" fill="#333"/>
  <rect x="170" y="200" width="120" height="70" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
  <line x1="170" y1="227" x2="290" y2="227" stroke="#d33" stroke-width="2"/>
  <text x="40" y="160" font-size="13" font-weight="bold" fill="#222">Штангенрейсмас</text>
  <text x="300" y="222" font-size="11" fill="#d33">риска на</text>
  <text x="300" y="236" font-size="11" fill="#d33">нужной высоте</text>
  <text x="40" y="332" font-size="11" fill="#555">Высоту выставляют по шкале (как у штангенциркуля),</text><text x="40" y="346" font-size="11" fill="#555">рейсмас ведут по плите вдоль детали.</text>

  <line x1="400" y1="200" x2="400" y2="350" stroke="#ccc" stroke-dasharray="6 4"/>

  <!-- ===== Как поставить керн ===== -->
  <text x="560" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Как поставить керн</text>
  <!-- 1 наклонить -->
  <rect x="430" y="300" width="110" height="20" fill="#f2b84b" stroke="#333"/>
  <line x1="440" y1="300" x2="530" y2="300" stroke="#d33" stroke-width="2"/>
  <line x1="485" y1="300" x2="485" y2="320" stroke="#d33" stroke-width="2"/>
  <g transform="rotate(-25 485 300)"><rect x="480" y="230" width="10" height="62" fill="#9aa5b1" stroke="#333"/><path d="M 480 292 L 485 300 L 490 292 Z" fill="#333"/></g>
  <text x="485" y="340" text-anchor="middle" font-size="11" fill="#222">1. Наклонить, остриё</text>
  <text x="485" y="354" text-anchor="middle" font-size="11" fill="#222">точно в крест рисок</text>
  <!-- 2 выпрямить и ударить -->
  <rect x="570" y="300" width="110" height="20" fill="#f2b84b" stroke="#333"/>
  <line x1="580" y1="300" x2="670" y2="300" stroke="#d33" stroke-width="2"/>
  <line x1="625" y1="300" x2="625" y2="320" stroke="#d33" stroke-width="2"/>
  <rect x="620" y="238" width="10" height="54" fill="#9aa5b1" stroke="#333"/><path d="M 620 292 L 625 300 L 630 292 Z" fill="#333"/>
  <rect x="604" y="222" width="42" height="14" rx="3" fill="#555"/>
  <line x1="660" y1="215" x2="634" y2="232" stroke="#d33" stroke-width="2" marker-end="url(#m)"/>
  <text x="625" y="340" text-anchor="middle" font-size="11" fill="#222">2. Выпрямить и один</text>
  <text x="625" y="354" text-anchor="middle" font-size="11" fill="#222">раз ударить молотком</text>
  <!-- 3 результат -->
  <circle cx="770" cy="280" r="32" fill="#f2b84b" stroke="#333"/>
  <line x1="735" y1="280" x2="805" y2="280" stroke="#d33" stroke-width="2"/><line x1="770" y1="245" x2="770" y2="315" stroke="#d33" stroke-width="2"/>
  <circle cx="770" cy="280" r="4" fill="#222"/>
  <text x="770" y="340" text-anchor="middle" font-size="11" fill="#222">3. Керн ровно в центре:</text>
  <text x="770" y="354" text-anchor="middle" font-size="11" fill="#222">сверло не «уйдёт»</text>

  <line x1="20" y1="375" x2="840" y2="375" stroke="#ccc" stroke-dasharray="6 4"/>

  <!-- ===== Порядок ===== -->
  <text x="430" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Порядок разметки отверстия на пластине (пример)</text>
  <g font-size="12" fill="#222">
    <!-- шаг 1 -->
    <rect x="40" y="420" width="150" height="100" fill="#cfd6dc" stroke="#333"/>
    <rect x="40" y="420" width="150" height="100" fill="#4fc3f7" opacity="0.25"/>
    <text x="115" y="545" text-anchor="middle">1. Очистить, покрасить</text>
    <text x="115" y="560" text-anchor="middle">(мел, лак): риску видно</text>
    <!-- шаг 2 -->
    <rect x="240" y="420" width="150" height="100" fill="#e1f0f8" stroke="#333"/>
    <line x1="240" y1="470" x2="390" y2="470" stroke="#d33" stroke-width="2"/>
    <line x1="240" y1="520" x2="240" y2="420" stroke="#2f6db5" stroke-width="4"/>
    <line x1="240" y1="520" x2="390" y2="520" stroke="#2f6db5" stroke-width="4"/>
    <line x1="315" y1="420" x2="315" y2="520" stroke="#d33" stroke-width="2"/>
    <text x="315" y="545" text-anchor="middle">2. Риски от базовых</text>
    <text x="315" y="560" text-anchor="middle">кромок (синие) по чертежу</text>
    <!-- шаг 3 -->
    <rect x="440" y="420" width="150" height="100" fill="#e1f0f8" stroke="#333"/>
    <line x1="440" y1="470" x2="590" y2="470" stroke="#d33" stroke-width="2"/><line x1="515" y1="420" x2="515" y2="520" stroke="#d33" stroke-width="2"/>
    <circle cx="515" cy="470" r="4" fill="#222"/>
    <text x="515" y="545" text-anchor="middle">3. Керн в пересечении</text>
    <text x="515" y="560" text-anchor="middle">рисок</text>
    <!-- шаг 4 -->
    <rect x="640" y="420" width="150" height="100" fill="#e1f0f8" stroke="#333"/>
    <line x1="640" y1="470" x2="790" y2="470" stroke="#d33" stroke-width="2"/><line x1="715" y1="420" x2="715" y2="520" stroke="#d33" stroke-width="2"/>
    <circle cx="715" cy="470" r="30" fill="none" stroke="#d33" stroke-width="2"/>
    <circle cx="715" cy="470" r="4" fill="#222"/>
    <circle cx="745" cy="470" r="2.5" fill="#222"/><circle cx="685" cy="470" r="2.5" fill="#222"/><circle cx="715" cy="440" r="2.5" fill="#222"/><circle cx="715" cy="500" r="2.5" fill="#222"/>
    <text x="715" y="545" text-anchor="middle">4. Циркулем окружность,</text>
    <text x="715" y="560" text-anchor="middle">на ней контрольные керны</text>
  </g>
  <text x="430" y="588" text-anchor="middle" font-size="12" fill="#555">Базовая кромка: ровный край, от которого меряют все размеры. Риску проводят один раз, без повторов: двойная риска = ошибка.</text>
</svg>
