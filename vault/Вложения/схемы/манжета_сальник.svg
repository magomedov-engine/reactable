<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" font-family="Arial, sans-serif">
<defs><pattern id="h" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a96a3" stroke-width="1"/></pattern><marker id="g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2a8a3a"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d33"/></marker></defs>
<rect width="860" height="660" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Манжета (сальник): устройство и установка</text>
<text x="30" y="62" font-size="15" font-weight="bold" fill="#222">Разрез (верхняя половина, увеличено)</text>
<rect x="60" y="100" width="380" height="70" fill="url(#h)" stroke="#333" stroke-width="2"/>
<text x="400" y="95" font-size="11" fill="#555">корпус</text>
<rect x="60" y="170" width="140" height="60" fill="#f6e27a" opacity="0.8"/>
<text x="130" y="205" font-size="13" fill="#7a6500" text-anchor="middle">МАСЛО</text>
<rect x="60" y="230" width="380" height="50" fill="#d9dee3" stroke="#333" stroke-width="2"/>
<text x="250" y="262" font-size="12" fill="#555" text-anchor="middle">вращающийся вал</text>
<path d="M 200 170 L 262 170 L 262 206 L 254 206 L 254 178 L 200 178 Z" fill="#555" stroke="#222"/>
<polygon points="200,178 254,178 254,204 242,214 228,222 216,230 206,230 200,218" fill="#424242" stroke="#111"/>
<circle cx="228" cy="206" r="6" fill="#fff" stroke="#2f6db5" stroke-width="3"/>
<polygon points="254,204 270,226 264,230 248,212" fill="#424242" stroke="#111"/>
<text x="282" y="212" font-size="11" fill="#555" text-anchor="start">снаружи</text>
<rect x="470" y="262" width="360" height="40" rx="6" fill="#e8f5e9" stroke="#2a8a3a"/>
<text x="482" y="280" font-size="12" fill="#1b5e20" text-anchor="start">Правило: пружина и кромка к маслу.</text>
<text x="482" y="296" font-size="12" fill="#1b5e20" text-anchor="start">Перевернули манжету: масло потечёт сразу.</text>
<g font-size="12" fill="#222" stroke="#555">
<text x="470" y="110" stroke="none">Металлический каркас: держит форму,</text><text x="470" y="125" stroke="none">плотно сидит в корпусе</text><line x1="468" y1="114" x2="258" y2="172"/>
<text x="470" y="160" stroke="none" fill="#2f6db5">Пружина: прижимает кромку к валу</text><line x1="468" y1="156" x2="234" y2="204" stroke="#2f6db5"/>
<text x="470" y="200" stroke="none" font-weight="bold">Рабочая кромка: смотрит в сторону масла</text><line x1="468" y1="196" x2="212" y2="228"/>
<text x="470" y="240" stroke="none">Пыльник: не пускает грязь снаружи</text><line x1="468" y1="236" x2="266" y2="226"/>
</g>
<line x1="20" y1="320" x2="840" y2="320" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="30" y="346" font-size="15" font-weight="bold" fill="#222">Запрессовка в корпус</text>
<rect x="30" y="440" width="70" height="90" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="200" y="440" width="70" height="90" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="120" y="470" width="60" height="70" fill="#d9dee3" stroke="#333"/>
<rect x="100" y="440" width="22" height="16" fill="#424242"/><rect x="178" y="440" width="22" height="16" fill="#424242"/>
<rect x="86" y="410" width="128" height="28" rx="3" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
<line x1="150" y1="362" x2="150" y2="404" stroke="#2a8a3a" stroke-width="5" marker-end="url(#g)"/>
<text x="150" y="560" font-size="12" fill="#2a8a3a" text-anchor="middle" font-weight="bold">ПРАВИЛЬНО</text>
<text x="150" y="576" font-size="12" fill="#2a8a3a" text-anchor="middle">оправка по наружному краю,</text>
<text x="150" y="592" font-size="12" fill="#2a8a3a" text-anchor="middle">давит ровно по всему кругу,</text>
<text x="150" y="608" font-size="12" fill="#2a8a3a" text-anchor="middle">до упора или до размера по ТК</text>
<rect x="310" y="440" width="70" height="90" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="480" y="440" width="70" height="90" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="400" y="470" width="60" height="70" fill="#d9dee3" stroke="#333"/>
<g transform="rotate(-12 430 436)"><rect x="380" y="428" width="22" height="16" fill="#424242"/><rect x="458" y="428" width="22" height="16" fill="#424242"/></g>
<rect x="450" y="390" width="20" height="30" fill="#6c7a89" stroke="#333"/><rect x="436" y="378" width="48" height="14" rx="3" fill="#555"/>
<line x1="460" y1="358" x2="460" y2="374" stroke="#d33" stroke-width="5" marker-end="url(#r)"/>
<text x="430" y="560" font-size="12" fill="#d33" text-anchor="middle" font-weight="bold">НЕПРАВИЛЬНО</text>
<text x="430" y="576" font-size="12" fill="#d33" text-anchor="middle">бородком или молотком по краю:</text>
<text x="430" y="592" font-size="12" fill="#d33" text-anchor="middle">манжета перекосилась,</text>
<text x="430" y="608" font-size="12" fill="#d33" text-anchor="middle">каркас погнут, течь</text>
<line x1="570" y1="335" x2="570" y2="640" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="590" y="370" font-size="13" font-weight="bold" fill="#222">Надеть на вал, не порезав</text>
<rect x="600" y="460" width="220" height="40" fill="#d9dee3" stroke="#333" stroke-width="2"/>
<rect x="740" y="460" width="60" height="8" fill="#fff" stroke="#333"/>
<text x="770" y="455" font-size="10" fill="#555" text-anchor="middle">шпоночный паз</text>
<rect x="700" y="454" width="120" height="52" fill="#4fc3f7" opacity="0.35" stroke="#0277bd" stroke-dasharray="4 3"/>
<text x="760" y="525" font-size="11" fill="#0277bd" text-anchor="middle">защитная гильза</text>
<rect x="640" y="440" width="14" height="80" fill="#424242"/>
<line x1="660" y1="420" x2="720" y2="420" stroke="#2a8a3a" stroke-width="4" marker-end="url(#g)"/>
<text x="590" y="560" font-size="12" fill="#222" text-anchor="start">Через шпоночный паз, шлицы</text>
<text x="590" y="576" font-size="12" fill="#222" text-anchor="start">и резьбу надевают через тонкую</text>
<text x="590" y="592" font-size="12" fill="#222" text-anchor="start">гильзу или ленту, иначе кромку</text>
<text x="590" y="608" font-size="12" fill="#222" text-anchor="start">порежет. Кромку смазать</text>
<text x="590" y="624" font-size="12" fill="#222" text-anchor="start">(по ТК), вал без задиров.</text>
</svg>