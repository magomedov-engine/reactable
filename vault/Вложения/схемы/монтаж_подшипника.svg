<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="Arial, sans-serif">
<defs><marker id="g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2a8a3a"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d33"/></marker><pattern id="h" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a96a3" stroke-width="1"/></pattern></defs>
<rect width="860" height="640" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Монтаж подшипника: давить только на то кольцо, которое садится</text>
<text x="150" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a8a3a">НА ВАЛ: правильно</text>
<text x="430" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#d33">НА ВАЛ: неправильно</text>
<text x="710" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a8a3a">В КОРПУС: правильно</text>
<rect x="130" y="228" width="40" height="160" fill="#d9dee3" stroke="#333" stroke-width="2"/><text x="150" y="380" text-anchor="middle" font-size="11" fill="#555">вал</text>
<rect x="116" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="82" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="106" cy="250" r="10" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="170" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="204" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="194" cy="250" r="10" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="116" y="150" width="10" height="78" fill="#9aa5b1" stroke="#333"/>
<rect x="174" y="150" width="10" height="78" fill="#9aa5b1" stroke="#333"/>
<rect x="116" y="140" width="68" height="12" fill="#6c7a89" stroke="#333"/>
<line x1="150" y1="80" x2="150" y2="132" stroke="#2a8a3a" stroke-width="5" marker-end="url(#g)"/>
<text x="160" y="100" font-size="11" fill="#2a8a3a">пресс / оправка</text>
<text x="150" y="410" text-anchor="middle" font-size="12" fill="#222">Оправка-втулка давит на</text>
<text x="150" y="426" text-anchor="middle" font-size="12" fill="#2a8a3a" font-weight="bold">ВНУТРЕННЕЕ кольцо</text>
<text x="150" y="442" text-anchor="middle" font-size="12" fill="#222">(оно садится на вал)</text>
<rect x="410" y="228" width="40" height="160" fill="#d9dee3" stroke="#333" stroke-width="2"/>
<rect x="396" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="362" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="386" cy="250" r="10" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="450" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="484" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="474" cy="250" r="10" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="362" y="150" width="10" height="78" fill="#9aa5b1" stroke="#333"/>
<rect x="488" y="150" width="10" height="78" fill="#9aa5b1" stroke="#333"/>
<rect x="362" y="140" width="136" height="12" fill="#6c7a89" stroke="#333"/>
<line x1="430" y1="80" x2="430" y2="132" stroke="#d33" stroke-width="5" marker-end="url(#r)"/>
<text x="440" y="100" font-size="11" fill="#d33">пресс / оправка</text>
<path d="M 380 238 L 390 248 L 384 252 L 392 262" fill="none" stroke="#d33" stroke-width="2.5"/>
<path d="M 468 238 L 478 248 L 472 252 L 480 262" fill="none" stroke="#d33" stroke-width="2.5"/>
<text x="430" y="410" text-anchor="middle" font-size="12" fill="#222">Давят на наружное кольцо:</text>
<text x="430" y="426" text-anchor="middle" font-size="12" fill="#d33" font-weight="bold">сила идёт через шарики</text>
<text x="430" y="442" text-anchor="middle" font-size="12" fill="#222">и оставляет вмятины на дорожках.</text>
<text x="430" y="458" text-anchor="middle" font-size="12" fill="#222">Подшипник шумит и быстро умрёт.</text>
<path d="M 590 228 L 642 228 L 642 300 L 590 300 Z" fill="url(#h)" stroke="#333" stroke-width="2"/>
<path d="M 778 228 L 830 228 L 830 300 L 778 300 Z" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="642" y="270" width="12" height="30" fill="url(#h)" stroke="#333" stroke-width="2"/><rect x="766" y="270" width="12" height="30" fill="url(#h)" stroke="#333" stroke-width="2"/>
<text x="740" y="352" font-size="11" fill="#555">упор (буртик)</text><line x1="770" y1="341" x2="772" y2="300" stroke="#555"/>
<text x="710" y="320" text-anchor="middle" font-size="11" fill="#555">корпус (разрез)</text>
<rect x="676" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="642" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="666" cy="250" r="10" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="730" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="764" y="230" width="14" height="40" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<circle cx="754" cy="250" r="10" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
<rect x="642" y="150" width="10" height="78" fill="#9aa5b1" stroke="#333"/>
<rect x="768" y="150" width="10" height="78" fill="#9aa5b1" stroke="#333"/>
<rect x="642" y="140" width="136" height="12" fill="#6c7a89" stroke="#333"/>
<line x1="710" y1="80" x2="710" y2="132" stroke="#2a8a3a" stroke-width="5" marker-end="url(#g)"/>
<text x="720" y="100" font-size="11" fill="#2a8a3a">пресс / оправка</text>
<text x="710" y="410" text-anchor="middle" font-size="12" fill="#222">Оправка давит на</text>
<text x="710" y="426" text-anchor="middle" font-size="12" fill="#2a8a3a" font-weight="bold">НАРУЖНОЕ кольцо</text>
<text x="710" y="442" text-anchor="middle" font-size="12" fill="#222">(оно садится в корпус)</text>
<line x1="290" y1="50" x2="290" y2="460" stroke="#ccc" stroke-dasharray="6 4"/><line x1="570" y1="50" x2="570" y2="460" stroke="#ccc" stroke-dasharray="6 4"/>
<line x1="20" y1="475" x2="840" y2="475" stroke="#ccc" stroke-dasharray="6 4"/>
<rect x="30" y="490" width="380" height="135" rx="8" fill="#fff3e0" stroke="#e59a14"/>
<text x="42" y="510" font-size="12" fill="#222" font-weight="bold">Посадка с нагревом (если так в ТК):</text>
<text x="42" y="527" font-size="12" fill="#222">• внутреннее кольцо греют индукционным</text>
<text x="42" y="544" font-size="12" fill="#222">  нагревателем или в масляной ванне,</text>
<text x="42" y="561" font-size="12" fill="#222">  обычно до ~80–110 °C (~пример, по ТК);</text>
<text x="42" y="578" font-size="12" fill="#222">• открытым пламенем НЕ греть;</text>
<text x="42" y="595" font-size="12" fill="#222">• надевать сразу, до упора, в перчатках</text>
<text x="42" y="612" font-size="12" fill="#222">  для горячего; держать до остывания.</text>
<rect x="440" y="490" width="390" height="135" rx="8" fill="#fdecea" stroke="#d33"/>
<text x="452" y="510" font-size="12" fill="#d33" font-weight="bold">Нельзя:</text>
<text x="452" y="527" font-size="12" fill="#222">✖ бить молотком прямо по кольцу или сепаратору;</text>
<text x="452" y="544" font-size="12" fill="#222">✖ раскручивать подшипник сжатым воздухом;</text>
<text x="452" y="561" font-size="12" fill="#222">✖ снимать упаковку и консервацию заранее;</text>
<text x="452" y="578" font-size="12" fill="#222">✖ ставить упавший подшипник (покажите мастеру);</text>
<text x="452" y="595" font-size="12" fill="#222">✖ снимать съёмником за наружное кольцо,</text>
<text x="452" y="612" font-size="12" fill="#222">   если с натягом сидит внутреннее.</text>
</svg>