<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Arial, sans-serif">
  <rect width="820" height="600" fill="#ffffff" rx="10"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Микрометр: из чего состоит и как прочитать размер (0,01 мм)</text>

  <!-- ===== ОБЩИЙ ВИД ===== -->
  <!-- скоба -->
  <path d="M 120 90 L 120 200 Q 120 250 170 250 L 300 250 Q 340 250 340 210 L 340 116 L 312 116 L 312 205 Q 312 222 295 222 L 172 222 Q 148 222 148 200 L 148 90 Z" fill="#9aa5b1" stroke="#333" stroke-width="2"/>
  <!-- пятка -->
  <rect x="148" y="132" width="24" height="26" fill="#c9d0d7" stroke="#333" stroke-width="1.5"/>
  <!-- деталь -->
  <rect x="172" y="122" width="44" height="46" fill="#f2b84b" stroke="#333" stroke-width="1.5"/>
  <!-- микровинт -->
  <rect x="216" y="136" width="96" height="18" fill="#c9d0d7" stroke="#333" stroke-width="1.5"/>
  <!-- стопор -->
  <rect x="319" y="102" width="14" height="14" fill="#6c7a89" stroke="#222"/>
  <!-- стебель -->
  <rect x="340" y="130" width="150" height="30" fill="#e3e7eb" stroke="#333" stroke-width="1.5"/>
  <line x1="340" y1="145" x2="490" y2="145" stroke="#333"/>
  <!-- барабан -->
  <path d="M 470 118 L 600 118 L 600 172 L 470 172 L 458 145 Z" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
  <g stroke="#555"><line x1="600" y1="124" x2="586" y2="124"/><line x1="600" y1="132" x2="590" y2="132"/><line x1="600" y1="140" x2="590" y2="140"/><line x1="600" y1="148" x2="586" y2="148"/><line x1="600" y1="156" x2="590" y2="156"/><line x1="600" y1="164" x2="590" y2="164"/></g>
  <!-- трещотка -->
  <rect x="600" y="130" width="50" height="30" rx="4" fill="#6c7a89" stroke="#222" stroke-width="2"/>
  <g stroke="#333"><line x1="610" y1="130" x2="610" y2="160"/><line x1="620" y1="130" x2="620" y2="160"/><line x1="630" y1="130" x2="630" y2="160"/><line x1="640" y1="130" x2="640" y2="160"/></g>

  <g font-size="12" fill="#222" stroke="#333">
    <text x="20" y="70" stroke="none">Скоба (не греть руками: держать за накладки)</text>
    <line x1="120" y1="74" x2="132" y2="92"/>
    <text x="150" y="104" stroke="none">Пятка</text>
    <line x1="160" y1="108" x2="160" y2="132"/>
    <text x="215" y="285" stroke="none">Микровинт: подходит к детали</text>
    <line x1="262" y1="273" x2="262" y2="154"/>
    <text x="256" y="100" stroke="none">Стопор</text>
    <line x1="306" y1="100" x2="319" y2="106"/>
    <text x="360" y="200" stroke="none">Стебель: шкала мм и 0,5 мм</text>
    <line x1="400" y1="188" x2="400" y2="160"/>
    <text x="480" y="98" stroke="none">Барабан: 50 делений по 0,01 мм</text>
    <line x1="540" y1="102" x2="540" y2="118"/>
    <text x="660" y="140" stroke="none">Трещотка:</text>
    <text x="660" y="156" stroke="none">крутить только её</text>
    <line x1="658" y1="146" x2="650" y2="146"/>
  </g>

  <line x1="20" y1="305" x2="800" y2="305" stroke="#ccc" stroke-dasharray="6 4"/>
  <text x="410" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Пример отсчёта: 12,73 мм (стебель и барабан увеличены)</text>

  <!-- стебель увеличенный: x = 60 + мм*30; продольная линия y=420 -->
  <rect x="50" y="380" width="400" height="80" fill="#eef1f4" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="420" x2="560" y2="420" stroke="#222" stroke-width="2"/>
  <!-- целые мм сверху -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="60" y1="420" x2="60" y2="398"/><line x1="90" y1="420" x2="90" y2="406"/><line x1="120" y1="420" x2="120" y2="406"/><line x1="150" y1="420" x2="150" y2="406"/><line x1="180" y1="420" x2="180" y2="406"/>
    <line x1="210" y1="420" x2="210" y2="398"/><line x1="240" y1="420" x2="240" y2="406"/><line x1="270" y1="420" x2="270" y2="406"/><line x1="300" y1="420" x2="300" y2="406"/><line x1="330" y1="420" x2="330" y2="406"/>
    <line x1="360" y1="420" x2="360" y2="398"/><line x1="390" y1="420" x2="390" y2="406"/>
  </g>
  <line x1="420" y1="420" x2="420" y2="402" stroke="#2f6db5" stroke-width="3"/>
  <!-- половинки снизу -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="75" y1="420" x2="75" y2="432"/><line x1="105" y1="420" x2="105" y2="432"/><line x1="135" y1="420" x2="135" y2="432"/><line x1="165" y1="420" x2="165" y2="432"/><line x1="195" y1="420" x2="195" y2="432"/><line x1="225" y1="420" x2="225" y2="432"/><line x1="255" y1="420" x2="255" y2="432"/><line x1="285" y1="420" x2="285" y2="432"/><line x1="315" y1="420" x2="315" y2="432"/><line x1="345" y1="420" x2="345" y2="432"/><line x1="375" y1="420" x2="375" y2="432"/><line x1="405" y1="420" x2="405" y2="432"/>
  </g>
  <line x1="435" y1="420" x2="435" y2="436" stroke="#e59a14" stroke-width="3"/>
  <g font-size="13" fill="#222" text-anchor="middle"><text x="60" y="394">0</text><text x="210" y="394">5</text><text x="360" y="394">10</text></g>
  <text x="300" y="452" font-size="11" fill="#555" text-anchor="middle">снизу: риски половинок (0,5 мм)</text>

  <!-- барабан увеличенный: край на 12,73 мм -> x = 60 + 12.73*30 = 441.9 -->
  <path d="M 442 360 L 560 360 L 560 480 L 442 480 Z" fill="#c9d3dc" stroke="#333" stroke-width="2"/>
  <!-- деления барабана: 23 на линии y=420, шаг 8 px, числа растут вверх -->
  <g stroke="#333" stroke-width="1.3"><line x1="442" y1="476" x2="454" y2="476"/><line x1="442" y1="468" x2="454" y2="468"/><line x1="442" y1="460" x2="454" y2="460"/><line x1="442" y1="452" x2="454" y2="452"/><line x1="442" y1="444" x2="462" y2="444"/><line x1="442" y1="436" x2="454" y2="436"/><line x1="442" y1="428" x2="454" y2="428"/><line x1="442" y1="412" x2="454" y2="412"/><line x1="442" y1="404" x2="462" y2="404"/><line x1="442" y1="396" x2="454" y2="396"/><line x1="442" y1="388" x2="454" y2="388"/><line x1="442" y1="380" x2="454" y2="380"/><line x1="442" y1="372" x2="454" y2="372"/><line x1="442" y1="364" x2="462" y2="364"/></g>
  <line x1="442" y1="420" x2="470" y2="420" stroke="#d33" stroke-width="3"/>
  <g font-size="12" fill="#222"><text x="466" y="448">20</text><text x="466" y="400">25</text><text x="466" y="368">30</text></g>
  <text x="476" y="425" font-size="14" font-weight="bold" fill="#d33">23</text>
  <text x="500" y="466" font-size="11" fill="#555">барабан</text>

  <!-- шаги -->
  <g font-size="14" fill="#222">
    <circle cx="610" cy="378" r="11" fill="#2f6db5"/><text x="610" y="383" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
    <text x="628" y="376">Верхняя шкала: последняя</text>
    <text x="628" y="393">видная черта <tspan fill="#2f6db5" font-weight="bold">12 мм</tspan></text>
    <circle cx="610" cy="422" r="11" fill="#e59a14"/><text x="610" y="427" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
    <text x="628" y="420">Видна ли после неё нижняя</text>
    <text x="628" y="437">риска? Да: <tspan fill="#e59a14" font-weight="bold">+0,5 мм</tspan></text>
    <circle cx="610" cy="466" r="11" fill="#d33"/><text x="610" y="471" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
    <text x="628" y="464">Барабан: с линией совпало</text>
    <text x="628" y="481">деление <tspan fill="#d33" font-weight="bold">23 = 0,23 мм</tspan></text>
  </g>
  <rect x="200" y="505" width="420" height="40" rx="8" fill="#fff8e1" stroke="#e59a14"/>
  <text x="410" y="531" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">12 + 0,5 + 0,23 = 12,73 мм</text>
  <text x="410" y="575" text-anchor="middle" font-size="12" fill="#555">Частая ошибка: не заметить нижнюю риску 0,5 мм и получить 12,23 вместо 12,73. Всегда проверяйте шаг 2.</text>
</svg>
