<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Arial, sans-serif">
  <defs>
    <pattern id="h1" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="1"/></pattern>
    <pattern id="h2" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="1"/></pattern>
  </defs>
  <rect width="860" height="560" fill="#ffffff" rx="10"/>
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Разрез и сборочный чертёж</text>

  <!-- ===== Вид и разрез втулки ===== -->
  <text x="200" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Втулка: вид снаружи и разрез</text>
  <!-- вид -->
  <rect x="40" y="110" width="120" height="96" fill="#eef1f4" stroke="#222" stroke-width="2.5"/>
  <line x1="40" y1="134" x2="160" y2="134" stroke="#222" stroke-width="1.2" stroke-dasharray="6 3"/>
  <line x1="40" y1="182" x2="160" y2="182" stroke="#222" stroke-width="1.2" stroke-dasharray="6 3"/>
  <line x1="30" y1="158" x2="170" y2="158" stroke="#d33" stroke-dasharray="14 3 2 3"/>
  <text x="100" y="232" text-anchor="middle" font-size="12" fill="#222">Вид: отверстие внутри</text>
  <text x="100" y="247" text-anchor="middle" font-size="12" fill="#222">видно только штрихами</text>
  <!-- разрез -->
  <rect x="240" y="110" width="120" height="24" fill="url(#h1)" stroke="#222" stroke-width="2.5"/>
  <rect x="240" y="182" width="120" height="24" fill="url(#h1)" stroke="#222" stroke-width="2.5"/>
  <line x1="240" y1="134" x2="240" y2="182" stroke="#222" stroke-width="2.5"/>
  <line x1="360" y1="134" x2="360" y2="182" stroke="#222" stroke-width="2.5"/>
  <line x1="230" y1="158" x2="370" y2="158" stroke="#d33" stroke-dasharray="14 3 2 3"/>
  <text x="300" y="232" text-anchor="middle" font-size="12" fill="#222">Разрез: деталь «разрезали»,</text>
  <text x="300" y="247" text-anchor="middle" font-size="12" fill="#222">металл под ножом заштрихован</text>
  <!-- нож -->
  <path d="M 206 70 L 222 70 L 214 92 Z" fill="#d33"/>
  <text x="214" y="104" text-anchor="middle" font-size="11" fill="#d33">разрезаем</text>
  <g font-size="12" fill="#2f6db5" stroke="#2f6db5">
    <text x="30" y="290" stroke="none">Штриховка (косые линии под 45°) = здесь сплошной металл.</text>
    <text x="30" y="306" stroke="none">Белое = пусто (отверстие, полость). Так сразу видно стенки и толщину.</text>
  </g>

  <line x1="420" y1="50" x2="420" y2="330" stroke="#ccc" stroke-dasharray="6 4"/>

  <!-- ===== Сборочный чертёж ===== -->
  <text x="640" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Сборочный чертёж узла (в разрезе)</text>
  <!-- корпус -->
  <path d="M 470 180 L 610 180 L 610 252 L 630 252 L 630 180 L 800 180 L 800 260 L 470 260 Z" fill="url(#h1)" stroke="#222" stroke-width="2.5"/>
  <!-- крышка -->
  <path d="M 520 150 L 606 150 L 606 180 L 520 180 Z" fill="url(#h2)" stroke="#222" stroke-width="2.5"/>
  <path d="M 634 150 L 750 150 L 750 180 L 634 180 Z" fill="url(#h2)" stroke="#222" stroke-width="2.5"/>
  <!-- шайба -->
  <rect x="592" y="143" width="56" height="7" fill="#d9dee3" stroke="#222" stroke-width="2"/>
  <!-- болт (по правилам не штрихуется) -->
  <rect x="598" y="121" width="44" height="22" fill="#f4f6f8" stroke="#222" stroke-width="2.5"/>
  <rect x="610" y="143" width="20" height="105" fill="#f4f6f8" stroke="#222" stroke-width="2.5"/>
  <line x1="613" y1="190" x2="613" y2="248" stroke="#222" stroke-width="1"/><line x1="627" y1="190" x2="627" y2="248" stroke="#222" stroke-width="1"/>
  <line x1="620" y1="110" x2="620" y2="270" stroke="#d33" stroke-dasharray="14 3 2 3"/>

  <!-- выноски с позициями -->
  <g stroke="#222" stroke-width="1" fill="#222" font-size="15" font-weight="bold">
    <circle cx="720" cy="225" r="3"/><line x1="720" y1="225" x2="770" y2="300"/><line x1="770" y1="300" x2="800" y2="300"/><text x="780" y="295" stroke="none">1</text>
    <circle cx="700" cy="165" r="3"/><line x1="700" y1="165" x2="760" y2="100"/><line x1="760" y1="100" x2="790" y2="100"/><text x="770" y="95" stroke="none">2</text>
    <circle cx="620" cy="130" r="3"/><line x1="620" y1="130" x2="570" y2="92"/><line x1="570" y1="92" x2="540" y2="92"/><text x="550" y="87" stroke="none">3</text>
    <circle cx="595" cy="146" r="3"/><line x1="595" y1="146" x2="500" y2="120"/><line x1="500" y1="120" x2="470" y2="120"/><text x="480" y="115" stroke="none">4</text>
  </g>
  <text x="470" y="290" font-size="12" fill="#555">Показан 1 болт из 4. Соседние детали</text>
  <text x="470" y="305" font-size="12" fill="#555">штрихуют в разные стороны. Болты, шайбы,</text>
  <text x="470" y="320" font-size="12" fill="#555">валы вдоль оси не штрихуют.</text>

  <!-- спецификация -->
  <line x1="20" y1="340" x2="840" y2="340" stroke="#ccc" stroke-dasharray="6 4"/>
  <text x="430" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Спецификация к этому чертежу: номер на выноске → строка таблицы</text>
  <g font-size="13" fill="#222">
    <rect x="150" y="380" width="560" height="140" fill="none" stroke="#222" stroke-width="1.5"/>
    <line x1="150" y1="408" x2="710" y2="408" stroke="#222" stroke-width="1.5"/>
    <line x1="150" y1="436" x2="710" y2="436" stroke="#222"/><line x1="150" y1="464" x2="710" y2="464" stroke="#222"/><line x1="150" y1="492" x2="710" y2="492" stroke="#222"/>
    <line x1="210" y1="380" x2="210" y2="520" stroke="#222"/><line x1="350" y1="380" x2="350" y2="520" stroke="#222"/><line x1="630" y1="380" x2="630" y2="520" stroke="#222"/>
    <g font-weight="bold"><text x="165" y="399">Поз.</text><text x="222" y="399">Обозначение</text><text x="362" y="399">Наименование</text><text x="645" y="399">Кол.</text></g>
    <text x="175" y="427">1</text><text x="222" y="427">ХХХХ.01</text><text x="362" y="427">Корпус</text><text x="660" y="427">1</text>
    <text x="175" y="455">2</text><text x="222" y="455">ХХХХ.02</text><text x="362" y="455">Крышка</text><text x="660" y="455">1</text>
    <rect x="151" y="465" width="558" height="26" fill="#fff8e1"/>
    <text x="175" y="483">3</text><text x="222" y="483"></text><text x="362" y="483">Болт М10×40, класс 10.9</text><text x="660" y="483">4</text>
    <text x="175" y="511">4</text><text x="222" y="511"></text><text x="362" y="511">Шайба 10</text><text x="660" y="511">4</text>
  </g>
  <text x="430" y="546" text-anchor="middle" font-size="12" fill="#555">Пример: видите на чертеже выноску «3» → в таблице строка 3: болт М10×40, нужно 4 штуки.</text>
</svg>
