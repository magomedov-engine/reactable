<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="Arial, sans-serif">
<defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
<rect width="860" height="640" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Сверление, зенковка, развёртка</text>
<text x="40" y="62" font-size="14" font-weight="bold" fill="#222">Спиральное сверло</text>
<rect x="40" y="90" width="150" height="34" fill="#9aa5b1" stroke="#333" stroke-width="1.5"/>
<rect x="190" y="90" width="260" height="34" fill="#cfd6dc" stroke="#333" stroke-width="1.5"/>
<path d="M 200 90 Q 214 107 200 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 228 90 Q 242 107 228 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 256 90 Q 270 107 256 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 284 90 Q 298 107 284 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 312 90 Q 326 107 312 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 340 90 Q 354 107 340 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 368 90 Q 382 107 368 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 396 90 Q 410 107 396 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 424 90 Q 438 107 424 124" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 450 90 L 480 107 L 450 124 Z" fill="#b7c2cc" stroke="#333" stroke-width="1.5"/>
<path d="M 452 98 A 30 30 0 0 1 452 116" fill="none" stroke="#d33" stroke-width="2"/>
<g font-size="12" fill="#222" stroke="#555">
<text x="40" y="150" stroke="none">хвостовик: зажимают в патроне</text><line x1="100" y1="138" x2="100" y2="124"/>
<text x="230" y="80" stroke="none">канавки: выводят стружку</text><line x1="290" y1="84" x2="290" y2="92"/>
<text x="300" y="165" stroke="none" fill="#d33">угол при вершине ~118°</text><line x1="440" y1="155" x2="465" y2="112" stroke="#d33"/>
</g>
<text x="500" y="72" font-size="12" fill="#222">• Сверлят по керну, сначала небольшим сверлом,</text>
<text x="500" y="90" font-size="12" fill="#222">  потом нужным (большое сверло по керну «уходит»).</text>
<text x="500" y="108" font-size="12" fill="#222">• Часто выводить сверло из отверстия: убрать стружку.</text>
<text x="500" y="126" font-size="12" fill="#222">• Охлаждать/смазывать (СОЖ, масло) по технологии.</text>
<text x="500" y="144" font-size="12" fill="#222">• К выходу сверла нажим уменьшать: может «закусить».</text>
<line x1="20" y1="180" x2="840" y2="180" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="40" y="206" font-size="14" font-weight="bold" fill="#222">Сверлильный станок: деталь только в тисках</text>
<rect x="60" y="560" width="260" height="20" fill="#6c7a89" stroke="#333"/>
<rect x="70" y="230" width="30" height="330" fill="#9aa5b1" stroke="#333"/>
<rect x="60" y="220" width="210" height="70" rx="8" fill="#b7c2cc" stroke="#333" stroke-width="2"/>
<rect x="200" y="290" width="20" height="40" fill="#9aa5b1" stroke="#333"/>
<rect x="196" y="330" width="28" height="26" fill="#6c7a89" stroke="#333"/>
<rect x="206" y="356" width="8" height="70" fill="#cfd6dc" stroke="#333"/>
<path d="M 206 426 L 210 436 L 214 426 Z" fill="#333"/>
<line x1="240" y1="250" x2="290" y2="300" stroke="#444" stroke-width="5"/><circle cx="292" cy="302" r="7" fill="#d33"/>
<rect x="100" y="480" width="210" height="14" fill="#9aa5b1" stroke="#333"/>
<rect x="140" y="440" width="140" height="40" fill="#6c7a89" stroke="#333"/>
<rect x="178" y="438" width="64" height="14" fill="#f2b84b" stroke="#333"/>
<rect x="160" y="430" width="18" height="30" fill="#444"/><rect x="242" y="430" width="18" height="30" fill="#444"/>
<rect x="250" y="452" width="40" height="6" fill="#444"/>
<g font-size="12" fill="#222" stroke="#555">
<text x="300" y="235" stroke="none">шпиндель и патрон с ключом:</text><text x="300" y="250" stroke="none" fill="#d33">ключ из патрона вынуть до пуска!</text><line x1="298" y1="240" x2="226" y2="340"/>
<text x="310" y="300" stroke="none">рукоять подачи: плавно</text>
<text x="320" y="430" stroke="none">деталь (жёлтая) в машинных</text><text x="320" y="445" stroke="none">тисках, тиски закреплены на столе</text><line x1="318" y1="436" x2="242" y2="445"/>
<text x="320" y="500" stroke="none">стол станка</text><line x1="318" y1="496" x2="310" y2="488"/>
</g>
<rect x="540" y="200" width="300" height="230" rx="8" fill="#fdecea" stroke="#d33"/>
<text x="552" y="222" font-size="12" fill="#d33" font-weight="bold">Нельзя:</text>
<text x="552" y="242" font-size="12" fill="#222">✖ держать деталь рукой: её сорвёт</text>
<text x="552" y="262" font-size="12" fill="#222">   и закрутит вместе со сверлом;</text>
<text x="552" y="282" font-size="12" fill="#222">✖ работать в перчатках, с рукавами</text>
<text x="552" y="302" font-size="12" fill="#222">   нараспашку, длинными волосами;</text>
<text x="552" y="322" font-size="12" fill="#222">✖ убирать стружку рукой или сдувать:</text>
<text x="552" y="342" font-size="12" fill="#222">   только щёткой и при остановленном</text>
<text x="552" y="362" font-size="12" fill="#222">   шпинделе;</text>
<text x="552" y="382" font-size="12" fill="#222">✖ останавливать патрон рукой;</text>
<text x="552" y="402" font-size="12" fill="#222">✖ работать без очков.</text>
<line x1="540" y1="450" x2="840" y2="450" stroke="#ccc" stroke-dasharray="6 4"/>
<text x="550" y="474" font-size="14" font-weight="bold" fill="#222">После сверления</text>
<rect x="560" y="490" width="14" height="50" fill="#9aa5b1" stroke="#333"/><path d="M 548 540 L 586 540 L 567 562 Z" fill="#cfd6dc" stroke="#333"/>
<text x="600" y="505" font-size="12" font-weight="bold" fill="#222">Зенковка</text><text x="600" y="521" font-size="11" fill="#555">снимает фаску у входа в</text><text x="600" y="535" font-size="11" fill="#555">отверстие (под винт, под резьбу)</text>
<rect x="560" y="570" width="14" height="20" fill="#9aa5b1" stroke="#333"/><rect x="556" y="590" width="22" height="40" fill="#cfd6dc" stroke="#333"/>
<line x1="556" y1="594" x2="578" y2="594" stroke="#555"/>
<line x1="556" y1="602" x2="578" y2="602" stroke="#555"/>
<line x1="556" y1="610" x2="578" y2="610" stroke="#555"/>
<line x1="556" y1="618" x2="578" y2="618" stroke="#555"/>
<line x1="556" y1="626" x2="578" y2="626" stroke="#555"/>
<text x="600" y="585" font-size="12" font-weight="bold" fill="#222">Развёртка</text><text x="600" y="601" font-size="11" fill="#555">точное гладкое отверстие (напр. H7).</text><text x="600" y="615" font-size="11" fill="#555">Вращать только вперёд, назад нельзя:</text><text x="600" y="629" font-size="11" fill="#555">испортите и отверстие, и развёртку</text>
<text x="40" y="605" font-size="12" fill="#555">Обороты и подачу берут из таблиц или ТК:</text><text x="40" y="621" font-size="12" fill="#555">чем больше сверло, тем меньше обороты.</text>
</svg>