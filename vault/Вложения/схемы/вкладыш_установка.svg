<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="Arial, sans-serif">
<defs><pattern id="h" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a96a3" stroke-width="1"/></pattern></defs>
<rect width="860" height="600" fill="#ffffff" rx="10"/>
<text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Вкладыш: из чего состоит и как ставится</text>
<text x="150" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Вкладыш сбоку</text>
<path d="M 70 210 A 80 80 0 0 1 230 210 L 214 210 A 64 64 0 0 0 86 210 Z" fill="#c9a227" stroke="#5d4a00" stroke-width="2"/>
<rect x="86" y="204" width="0" height="0"/>
<path d="M 86 210 A 64 64 0 0 1 214 210" fill="none" stroke="#9e9e9e" stroke-width="5"/>
<rect x="144" y="129" width="12" height="19" fill="#fff"/>
<rect x="60" y="196" width="12" height="12" fill="#c9a227" stroke="#5d4a00" stroke-width="2"/>
<g font-size="12" fill="#222" stroke="#555">
<text x="20" y="250" stroke="none">«Усик»: фиксирует</text><text x="20" y="265" stroke="none">положение</text>
<line x1="50" y1="240" x2="64" y2="204"/>
<text x="175" y="102" stroke="none">масляное отверстие</text><line x1="190" y1="106" x2="154" y2="134"/>
<text x="160" y="262" stroke="none">рабочая поверхность</text><text x="160" y="277" stroke="none">(серая): не трогать!</text><line x1="190" y1="250" x2="190" y2="162"/>
<text x="110" y="228" stroke="none" fill="#555">стальная основа</text>
</g>
<text x="400" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Если посмотреть внутрь</text>
<rect x="310" y="110" width="180" height="110" fill="#bdbdbd" stroke="#5d4a00" stroke-width="2"/>
<rect x="318" y="159" width="164" height="12" fill="#f6e27a" stroke="#a08300"/>
<circle cx="400" cy="165" r="9" fill="#fff" stroke="#222" stroke-width="1.5"/>
<rect x="300" y="118" width="10" height="20" fill="#c9a227" stroke="#5d4a00" stroke-width="1.5"/>
<text x="400" y="240" text-anchor="middle" font-size="12" fill="#222">жёлтое: канавка для масла,</text><text x="400" y="255" text-anchor="middle" font-size="12" fill="#222">кружок: отверстие</text>
<text x="400" y="275" text-anchor="middle" font-size="11" fill="#555">У одной половины канавка и отверстие есть,</text><text x="400" y="289" text-anchor="middle" font-size="11" fill="#555">у другой может не быть: их не путают</text>
<text x="560" y="80" font-size="13" fill="#222" font-weight="bold">Правила:</text>
<text x="560" y="99" font-size="13" fill="#222">• вкладыши ставят только своей группы</text>
<text x="560" y="118" font-size="13" fill="#222">  и в свою постель/крышку;</text>
<text x="560" y="137" font-size="13" fill="#222">• усик точно в пазу;</text>
<text x="560" y="156" font-size="13" fill="#222">• отверстие во вкладыше над каналом</text>
<text x="560" y="175" font-size="13" fill="#222">  в блоке;</text>
<text x="560" y="194" font-size="13" fill="#222">• руками за рабочий слой не браться;</text>
<text x="560" y="213" font-size="13" fill="#222">• смазать чистым маслом по ТК;</text>
<text x="560" y="232" font-size="13" fill="#222">• не подпиливать, не подгонять.</text>
<line x1="20" y1="310" x2="840" y2="310" stroke="#ccc" stroke-dasharray="6 4"/>
<path d="M 75 345 L 355 345 L 355 455 L 293 455 A 78 78 0 0 0 137 455 L 75 455 Z" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="125" y="441" width="12" height="14" fill="#fff" stroke="#333"/>
<rect x="209" y="345" width="12" height="32" fill="#f6e27a" stroke="#a08300"/>
<text x="227" y="359" font-size="11" fill="#7a6500">масляный канал</text>
<g transform="rotate(0 215 455)">
<path d="M 137 455 A 78 78 0 0 1 293 455 L 279 455 A 64 64 0 0 0 151 455 Z" fill="#c9a227" stroke="#5d4a00" stroke-width="2"/>
<path d="M 151 455 A 64 64 0 0 1 279 455" fill="none" stroke="#9e9e9e" stroke-width="5"/>
<rect x="209" y="376" width="12" height="17" fill="#f6e27a"/>
<rect x="127" y="442" width="11" height="11" fill="#c9a227" stroke="#5d4a00" stroke-width="1.5"/>
</g>
<circle cx="215" cy="455" r="61" fill="#e3e7eb" stroke="#333" stroke-width="1.5"/>
<text x="215" y="460" text-anchor="middle" font-size="12" fill="#333">шейка вала</text>
<path d="M 505 345 L 785 345 L 785 455 L 723 455 A 78 78 0 0 0 567 455 L 505 455 Z" fill="url(#h)" stroke="#333" stroke-width="2"/>
<rect x="555" y="441" width="12" height="14" fill="#fff" stroke="#333"/>
<rect x="639" y="345" width="12" height="32" fill="#f6e27a" stroke="#a08300"/>
<text x="657" y="359" font-size="11" fill="#7a6500">масляный канал</text>
<g transform="rotate(35 645 455)">
<path d="M 567 455 A 78 78 0 0 1 723 455 L 709 455 A 64 64 0 0 0 581 455 Z" fill="#c9a227" stroke="#5d4a00" stroke-width="2"/>
<path d="M 581 455 A 64 64 0 0 1 709 455" fill="none" stroke="#9e9e9e" stroke-width="5"/>
<rect x="639" y="376" width="12" height="17" fill="#f6e27a"/>
<rect x="557" y="442" width="11" height="11" fill="#c9a227" stroke="#5d4a00" stroke-width="1.5"/>
</g>
<circle cx="645" cy="455" r="61" fill="#e3e7eb" stroke="#333" stroke-width="1.5"/>
<text x="645" y="460" text-anchor="middle" font-size="12" fill="#333">шейка вала</text>
<text x="215" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a8a3a">ПРАВИЛЬНО</text>
<text x="645" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#d33">НЕПРАВИЛЬНО</text>
<text x="215" y="565" text-anchor="middle" font-size="12" fill="#222">Усик в пазу, отверстие под каналом:</text><text x="215" y="581" text-anchor="middle" font-size="12" fill="#2a8a3a">масло проходит к шейке</text>
<text x="645" y="565" text-anchor="middle" font-size="12" fill="#222">Вкладыш сдвинут, усик не в пазу, отверстие ушло:</text><text x="645" y="581" text-anchor="middle" font-size="12" fill="#d33">масло не идёт → задир и проворот вкладыша</text>
<g stroke="#d33" stroke-width="4"><line x1="633" y1="367" x2="657" y2="391"/><line x1="657" y1="367" x2="633" y2="391"/></g>
</svg>