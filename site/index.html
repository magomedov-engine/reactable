<!doctype html>
<html lang="ru" data-theme="dark" style="background:#141517">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Курс для старта с нуля: слесарь механосборочных работ, сборка 12-цилиндрового дизеля. Уроки, схемы, глоссарий." />
    <meta name="theme-color" content="#141517" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>reactable</title>
    <script>
      // размер текста до загрузки приложения; тема у reactable всегда тёмная
      document.documentElement.dataset.theme = 'dark'
      try {
        var fs = localStorage.getItem('slesar:font')
        if (fs) document.documentElement.style.setProperty('--reader-scale', fs)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
